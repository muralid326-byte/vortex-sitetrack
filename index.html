<style>
/* ---------- Vortex SiteTrack — site log for a Singapore industrial contractor ----------
   ink sidebar, paper workspace, one red hazard rule as the single loud element. */
:root{
  --ink:#0F141C; --steel:#1C2431; --red:#D71920;
  --paper:#F4F6F9; --card:#FFFFFF; --line:#E3E7ED; --line2:#EFF2F6;
  --text:#141A23; --muted:#6C7686; --muted2:#98A2B0;
  --green:#0E7A45; --amber:#B26B00; --blue:#1F5FBF; --danger:#C0392B;
  --r:12px; --r-sm:9px;
  --sh:0 1px 2px rgba(15,20,28,.05), 0 1px 8px rgba(15,20,28,.04);
  --sh-lift:0 4px 16px rgba(15,20,28,.09);
  --body:Calibri,'Segoe UI',Arial,Helvetica,sans-serif; --display:var(--body);
  --mono:Consolas,'Lucida Console',Menlo,monospace;
  --side:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.55;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:var(--steel);color:#fff}
button{font-family:inherit;cursor:pointer}
a{color:var(--blue)}
input,select,textarea{font-family:inherit;font-size:15px;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:var(--r-sm);padding:10px 12px;width:100%;transition:border-color .12s,box-shadow .12s}
input:hover,select:hover{border-color:#CBD3DD}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--steel);box-shadow:0 0 0 3px rgba(28,36,49,.09)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
input[type=number]{font-family:var(--mono)}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600}
h1,h2,h3{font-family:var(--display);font-weight:700;color:var(--steel);line-height:1.25}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}

/* ---------- buttons ---------- */
.btn{background:var(--steel);color:#fff;border:1px solid var(--steel);border-radius:var(--r-sm);padding:11px 20px;font-weight:600;font-size:14px;letter-spacing:.01em;transition:transform .08s,box-shadow .12s,background .12s}
.btn:hover{background:#28323F;box-shadow:var(--sh-lift)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.sec{background:#fff;color:var(--steel);border-color:var(--line)}
.btn.sec:hover{background:#fff;border-color:var(--steel)}
.btn.danger{background:#fff;color:var(--danger);border-color:#EBC7C1}
.btn.danger:hover{background:#FDF3F1;border-color:var(--danger)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:7px}

/* ---------- app shell ---------- */
#appView{display:flex;min-height:100vh}
#side{width:var(--side);flex:none;background:#fff;color:var(--text);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;
  box-shadow:2px 0 18px rgba(15,20,28,.07);border-right:1px solid var(--line)}
#side::after{content:"";position:absolute;top:0;right:-1px;bottom:0;width:3px;
  background:repeating-linear-gradient(180deg,var(--red) 0 14px,transparent 14px 28px);opacity:.85}
.brandbox{padding:20px 18px 16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.brandbox img{height:38px;width:auto;align-self:flex-start}
.brandbox .app{font-family:var(--display);font-size:12.5px;letter-spacing:.16em;color:var(--muted);font-weight:700;padding-left:2px}
nav.tabs{display:flex;flex-direction:column;gap:2px;padding:14px 11px;overflow-y:auto;flex:1}
nav.tabs button{background:transparent;border:none;color:var(--muted);border-radius:9px;padding:10px 12px;font-size:14px;font-weight:500;text-align:left;display:flex;align-items:center;gap:11px;transition:background .12s,color .12s}
nav.tabs button:hover{background:var(--paper);color:var(--text)}
nav.tabs button.on{background:var(--steel);color:#fff;font-weight:600;box-shadow:0 2px 8px rgba(28,36,49,.22)}
nav.tabs button.on svg{color:var(--red)}
#tabsNav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sidefoot{padding:14px 16px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sidefoot .uname{font-size:13px;color:var(--text);font-weight:600;word-break:break-word}
.rolebadge{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;align-self:flex-start;text-transform:capitalize;background:var(--paper)}
#content{margin-left:var(--side);flex:1;min-width:0}
.topbar{display:none}
.wrap{max-width:1060px;margin:0 auto;padding:30px 26px 80px}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.grid{display:grid;gap:16px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:18px;background:#fff;box-shadow:var(--sh)}
legend{font-size:13px;color:var(--steel);padding:0 9px;font-weight:700}
.msg{padding:12px 15px;border-radius:var(--r-sm);font-size:14px;margin:14px 0;line-height:1.5}
.msg.err{background:#FDF2F0;color:#8E2C1D;border:1px solid #F2CFC8}
.msg.ok{background:#EFF8F3;color:#0B5C34;border:1px solid #C6E7D6}
.note{background:var(--paper);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;margin-top:12px;border-left:3px solid var(--red)}
.code{font-family:var(--mono);font-size:12px;background:var(--steel);color:#fff;padding:3px 8px;border-radius:5px;font-weight:600}

/* ---------- numbers ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--steel)}
.stat:first-child::before{background:var(--red)}
.stat .v{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.15;color:var(--steel);letter-spacing:-.02em}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
.kv{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px}
.kv div b{font-family:var(--mono);font-size:19px;display:block;color:var(--steel)}
.kv div span{font-size:12.5px;color:var(--muted);font-weight:600}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--muted);text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:11px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td{background:#FAFBFD}
.tbl .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.tbl tfoot td{border-top:1px solid var(--line);font-weight:600;background:var(--paper)}
.tbl select{padding:6px 9px;font-size:13px;border-radius:7px}

/* ---------- pills ---------- */
.pill{font-size:11.5px;border-radius:99px;padding:3px 10px;font-weight:600;white-space:nowrap;text-transform:capitalize}
.pill.ongoing,.pill.submitted{background:#E8F0FC;color:#17458E}
.pill.completed,.pill.approved{background:#E7F5EE;color:#0B5C34}
.pill.on-hold,.pill.hol,.pill.pending{background:#FCF3E1;color:#8A5200}
.pill.inactive,.pill.rejected,.pill.high{background:#FBEAE7;color:#8E2C1D}
.pill.low{background:#EEF1F5;color:#5B6675}

/* ---------- entry rows ---------- */
.rowset{display:grid;gap:9px}
.rowline{display:grid;gap:9px;grid-template-columns:2fr .7fr .9fr .9fr .9fr auto;align-items:center}
.rowline.wk{grid-template-columns:2.2fr .9fr .9fr .9fr auto}
.rowline.r3{grid-template-columns:2fr 1fr 1fr auto}
.rowline .x{background:#fff;border:1px solid var(--line);color:var(--muted2);border-radius:8px;width:38px;height:40px;font-size:17px;line-height:1}
.rowline .x:hover{color:var(--red);border-color:var(--red)}
.addrow{background:#fff;border:1px dashed #CBD3DD;color:var(--muted);border-radius:var(--r-sm);padding:10px;font-size:13px;width:100%;font-weight:500}
.addrow:hover{color:var(--steel);border-color:var(--steel);background:#FAFBFD}
.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.subnav button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:7px 15px;font-size:13.5px;font-weight:500}
.subnav button:hover{border-color:var(--steel);color:var(--steel)}
.subnav button.on{background:var(--steel);border-color:var(--steel);color:#fff;font-weight:600}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chips button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500}
.chips button.on{background:var(--steel);border-color:var(--steel);color:#fff;font-weight:600}
.pill.to_start{background:#EEF1F5;color:#5B6675}
.pill.ongoing2{background:#E8F0FC;color:#17458E}
.stat.warn::before{background:var(--amber)}
.stat.good::before{background:var(--green)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:14px;background:#fff}
.seg button{background:#fff;border:none;padding:9px 17px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--steel);color:#fff;font-weight:600}
.checkline{display:flex;align-items:center;gap:9px;font-size:14px}
.checkline input{width:auto;accent-color:var(--steel)}
.filedrop{display:block;border:1px dashed #CBD3DD;border-radius:var(--r-sm);padding:18px;text-align:center;color:var(--muted);font-size:13.5px;cursor:pointer;font-weight:500}
.filedrop:hover{border-color:var(--steel);color:var(--steel);background:#FAFBFD}
.filedrop input{display:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:12px}
.photos .thumb{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--paper)}
.photos img{width:100%;height:94px;object-fit:cover;display:block}
.photos .thumb button{position:absolute;top:5px;right:5px;background:rgba(15,20,28,.7);color:#fff;border:none;border-radius:6px;width:25px;height:25px;font-size:14px;line-height:1}
.costbar{display:flex;flex-wrap:wrap;gap:20px;align-items:baseline;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 16px;margin-top:12px}
.costbar b{font-family:var(--mono);font-size:19px;color:var(--steel)}
.costbar span{font-size:12.5px;color:var(--muted);font-weight:600;display:block}

/* ---------- reports ---------- */
details.rep{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:#fff;box-shadow:var(--sh);overflow:hidden}
details.rep summary{padding:14px 17px;cursor:pointer;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;list-style:none}
details.rep summary::-webkit-details-marker{display:none}
details.rep summary:hover{background:#FAFBFD}
details.rep[open] summary{border-bottom:1px solid var(--line2);background:#FAFBFD}
details.rep .body{padding:16px 17px 18px;font-size:14px}
.revbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;align-items:center;padding-top:14px;border-top:1px solid var(--line2)}
.flexbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:20px}
.flexbar>div{min-width:135px}
.pl-line{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line2);font-size:14px}
.pl-line b{font-family:var(--mono);white-space:nowrap}
.pl-line.total{border-top:1px solid var(--line);border-bottom:none;font-weight:600;font-size:16.5px;margin-top:4px;padding-top:13px}
.profit-pos{color:var(--green)} .profit-neg{color:var(--danger)}
.sitecard h3{font-size:19px}

/* ---------- to-do ---------- */
.todo{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line2)}
.todo:last-child{border-bottom:none}
.todo input[type=checkbox]{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--green)}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-size:14.5px;font-weight:500}
.td-meta{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- login ---------- */
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--ink);position:relative;overflow:hidden}
.login-shell::before{content:"";position:absolute;inset:auto 0 0 0;height:6px;
  background:repeating-linear-gradient(45deg,var(--red) 0 16px,var(--ink) 16px 32px)}
.login-card{width:100%;max-width:404px;position:relative;z-index:1}
.login-card .hazard{height:6px;border-radius:var(--r) var(--r) 0 0;background:repeating-linear-gradient(45deg,var(--red) 0 14px,var(--steel) 14px 28px)}
.login-card .inner{background:#fff;border-radius:0 0 var(--r) var(--r);padding:34px 30px 30px;box-shadow:0 24px 60px rgba(0,0,0,.4)}
.login-card .logo{display:flex;justify-content:center;margin-bottom:10px}
.login-card .logo img{height:42px}
.login-card .sub{font-size:13px;color:var(--muted);margin-bottom:26px;text-align:center}

/* ---------- setup banner ---------- */
#setupBar:not(:empty){max-width:1060px;margin:22px auto -8px;padding:0 26px}
.setup{background:#FDF2F0;border:1px solid #F2CFC8;border-left:3px solid var(--red);border-radius:var(--r-sm);padding:14px 16px;font-size:14px;color:#8E2C1D;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.setup b{font-weight:600}
pre.sql{background:var(--ink);color:#D9E1EC;font-family:var(--mono);font-size:11.5px;line-height:1.6;padding:16px;border-radius:var(--r-sm);overflow:auto;max-height:340px;white-space:pre;margin-top:12px}
.offbar{position:fixed;left:0;right:0;bottom:0;background:var(--amber);color:#fff;font-size:13px;padding:11px 16px;text-align:center;z-index:60;font-weight:600}
.offbar.sync{background:var(--green)}

/* ---------- mobile: top bar + bottom app nav ---------- */
@media(max-width:900px){
  #side{position:static;width:auto;flex-direction:row;background:transparent}
  #side::after{display:none}
  #appView{display:block;padding-bottom:74px}
  .brandbox,.sidefoot{display:none}
  #content{margin-left:0}
  .topbar{display:flex;align-items:center;gap:11px;background:#fff;padding:10px 15px;position:sticky;top:0;z-index:25;
    box-shadow:0 2px 12px rgba(15,20,28,.08);
    border-bottom:3px solid transparent;
    border-image:repeating-linear-gradient(45deg,var(--red) 0 12px,#fff 12px 24px) 3}
  .topbar img{height:30px}
  .topbar .app{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700}
  .topbar .spacer{flex:1}
  .topbar .uname{font-size:12px;color:var(--muted);max-width:104px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .topbar .btn{padding:5px 11px;font-size:12px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;gap:0;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:#fff;border-top:1px solid var(--line);overflow-x:auto;z-index:40;box-shadow:0 -2px 14px rgba(15,20,28,.07)}
  nav.tabs button{flex:1 0 auto;flex-direction:column;gap:4px;min-width:70px;padding:7px 6px;font-size:10px;letter-spacing:.02em;
    color:var(--muted);text-align:center;border-radius:8px;font-weight:600}
  nav.tabs button span{white-space:nowrap;font-size:10px}
  nav.tabs button:hover{background:transparent;color:var(--steel)}
  nav.tabs button.on{background:transparent;color:var(--red)}
  nav.tabs button.on svg{color:var(--red)}
  #tabsNav svg{width:21px;height:21px}
  .wrap{padding:18px 15px 40px}
  #setupBar:not(:empty){padding:0 15px;margin:16px auto -4px}
  .card,fieldset{padding:16px;border-radius:var(--r-sm)}
  .f2,.f3{grid-template-columns:1fr}
  .board{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:13px 14px}
  .stat .v{font-size:22px}
  .rowline{grid-template-columns:1.5fr .6fr .7fr .7fr .7fr auto;gap:6px}
  .rowline.wk{grid-template-columns:1.5fr .7fr .7fr .7fr auto;gap:6px}
  .rowline.r3{grid-template-columns:1.6fr 1fr 1fr auto;gap:6px}
  .rowline input,.rowline select{padding:9px 8px;font-size:14px}
  .rowline .x{width:32px;height:38px}
  .flexbar>div{min-width:118px;flex:1}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

async function enter(){
  const {data:{user}} = await sb.auth.getUser();
  const {data:prof,error} = await sb.from("profiles").select("*").eq("id",user.id).single();
  if(error||!prof){ liMsg("Profile not found — check database setup."); return; }

  ME=prof;
  const setTxt=(cls,t)=>document.querySelectorAll("."+cls).forEach(e=>e.textContent=t);

  await openTab(ME.role==="admin"?"dash":supGroups()[0][2][0][0]);
  netStatus(); flushQueue(); schemaCheck();
}

async function loadBase(){
  const [s,w,t,st,wk] = await Promise.all([
    sb.from("sites").select("*").order("name"),
    sb.from("work_items").select("*").order("name"),
    sb.from("trades").select("*").order("sort"),
    sb.from("settings").select("*").eq("id",1).single(),
    sb.from("workers").select("*").order("name")
  ]);
  SITES=s.data||[]; WORKS=w.data||[]; TRADES=t.data||[]; WORKERS=wk.data||[];
  if(st.data) SET=st.data;
  if(ME.role==="admin"){ const p=await sb.from("profiles").select("*").order("full_name"); PROFILES=p.data||[]; }
}
const siteName = id => (SITES.find(s=>s.id===id)||{}).name||"—";
const siteCode = id => (SITES.find(s=>s.id===id)||{}).code||"";
const siteLabel = s => (s.code?s.code+" — ":"")+s.name;

const profName = id => (PROFILES.find(p=>p.id===id)||{}).full_name||"";
const tradeRate = name => { const t=TRADES.find(x=>x.name===name); return t?+t.rate:0; };
const workerById = id => WORKERS.find(w=>w.id===id);
/* a named worker may carry his own hourly rate; 0 / blank falls back to the trade rate */
function mpRate(m){
  if(m.worker_id){ const w=workerById(m.worker_id); if(w && +w.rate>0) return +w.rate; if(w && !m.trade) return tradeRate(w.trade); }
  return tradeRate(m.trade);
}

/* labour cost of one report using rates + OT/holiday rules */
function repCalc(r){
  let men=0, normH=0, otH=0, premH=0, cost=0;
  const holM=+SET.holiday_multiplier, otM=+SET.ot_multiplier;
  (r.manpower||[]).forEach(m=>{
    const c=+m.count||0, nh=+(m.norm_hours??m.hours)||0, oh=+m.ot_hours||0, ph=+m.prem_hours||0, rate=mpRate(m);
    men+=c; normH+=c*nh; otH+=c*oh; premH+=c*ph;
    /* Sunday / public holiday: the whole day is charged at the premium rate */
    const dayM = r.is_holiday? holM : 1;
    const otEff = r.is_holiday? holM : otM;
    cost += c*rate*(nh*dayM + oh*otEff + ph*holM);
  });
  return {men, normH, otH, premH, hrs:normH+otH+premH, cost};
}
async function fetchReports(from,to,siteId,opts){
  opts=opts||{};
  let q=sb.from("daily_reports").select("*").order("report_date",{ascending:false});
  if(from) q=q.gte("report_date",from); if(to) q=q.lte("report_date",to);
  if(siteId) q=q.eq("site_id",siteId);
  if(opts.status) q=q.eq("status",opts.status);
  const {data,error}=await q;
  let rows = error?[]:(data||[]);
  /* rejected reports never count towards hours or cost */
  if(opts.costable) rows = rows.filter(r=>(r.status||"submitted")!=="rejected");
  if(opts.approvedOnly) rows = rows.filter(r=>r.status==="approved");
  return rows;
}

function supGroups(){
  const p=perms();
  const gs=SUP_GROUPS.map(g=>[g[0],g[1],g[2].filter(([k])=>p[k]!==false && !(k==="sites"&&p.addproj===false))])
                     .filter(g=>g[2].length && p[g[0]]!==false);
  return gs.length?gs:[["entry","New report",[["entry","New daily report"]]]];
}
function supTabs(){ return supGroups().map(g=>[g[0],g[1]]); }
function myGroups(){ return ME.role==="admin"?GROUPS:supGroups(); }
function buildTabs(){
  const tabs = ME.role==="admin"?TABS_ADMIN:supTabs();
  $("tabsNav").innerHTML = tabs.map(([k,l])=>`<button data-t="${k}"><svg viewBox="0 0 24 24">${ICO[k]||""}</svg><span>${l}</span></button>`).join("");
  $("tabsNav").querySelectorAll("button").forEach(b=> b.onclick=()=>openTab(b.dataset.t));
}
async function openTab(k,arg){
  const gs=myGroups();
  if(ME.role!=="admin"){
    const allowed=new Set(gs.flatMap(g=>g[2].map(x=>x[0])).concat(["setup"]));
    if(!allowed.has(k)) k=gs[0][2][0][0];
  }
  const grp=gs.find(g=>g[2].some(x=>x[0]===k));
  $("tabsNav").querySelectorAll("button").forEach(b=>b.classList.toggle("on",!!grp&&b.dataset.t===grp[0]));
  $("main").innerHTML=`<p class="muted">Loading…</p>`;
  await loadBase();
  await ({dash:vDash,pl:vPL,reports:vReports,resources:vResources,entry:vEntry,sites:vSites,workers:vWorkers,todo:vTodo,access:vAccess,setup:vSetup,rates:vRates,team:vTeam,mine:vMine,addproj:vSites,import:vImport,po:vPO,records:vRecords}[k])(arg);
  if(grp && grp[2].length>1){
    $("main").insertAdjacentHTML("afterbegin",
      `<div class="subnav">${grp[2].map(([sk,sl])=>`<button data-sub="${sk}" class="${sk===k?"on":""}">${sl}</button>`).join("")}</div>`);
    $("main").querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>openTab(b.dataset.sub));
  }
}

/* ================= DASHBOARD ================= */
async function vDash(){
  const [dF,dT]=rangeDefaults();
  $("main").innerHTML=`
    <div class="flexbar">
      <div><label>From</label><input type="date" id="dFrom" value="${dF}"></div>
      <div><label>To</label><input type="date" id="dTo" value="${dT}"></div>
      <button class="btn sm" id="dGo">Apply</button>
      <button class="btn sec sm" id="dCsv">Export CSV</button>
    </div>
    <div class="board" id="dBoard"></div>
    <div id="dAttention"></div>
    <h2 style="font-size:19px;margin:22px 0 12px">By project</h2>
    <div class="chips" id="dChips"></div>
    <div class="grid" id="dSites"></div>`;
  $("dGo").onclick=render; $("dCsv").onclick=()=>exportCsv($("dFrom").value,$("dTo").value);
  let filter="active";
  await render();

  async function render(){
    const reps=await fetchReports($("dFrom").value,$("dTo").value,null,{costable:true});
    const [{data:tds},{data:pend}] = await Promise.all([
      sb.from("todos").select("*").eq("status","open"),
      sb.from("daily_reports").select("id,site_id,report_date,supervisor_id").eq("status","submitted")
    ]);
    const todos=tds||[], pending=pend||[];
    let tNorm=0,tOt=0,tCost=0; const by={};
    const menToday=reps.filter(r=>r.report_date===today()).reduce((a,r)=>a+repCalc(r).men,0);
    const sitesToday=new Set(reps.filter(r=>r.report_date===today()).map(r=>r.site_id));
    reps.forEach(r=>{
      const c=repCalc(r); tNorm+=c.normH; tOt+=c.otH; tCost+=c.cost;
      const b=(by[r.site_id]=by[r.site_id]||{normH:0,otH:0,cost:0,reps:[],mats:{},last:null});
      b.normH+=c.normH; b.otH+=c.otH; b.cost+=c.cost; b.reps.push(r);
      if(!b.last||r.report_date>b.last) b.last=r.report_date;
      (r.materials||[]).forEach(m=>{const k=`${m.name} (${m.unit||"nos"})`; b.mats[k]=(b.mats[k]||0)+(+m.qty||0);});
    });
    const st=x=>x.status||(x.active?"ongoing":"completed");
    const counts={ongoing:SITES.filter(x=>st(x)==="ongoing").length,
                  to_start:SITES.filter(x=>st(x)==="to_start").length,
                  completed:SITES.filter(x=>st(x)==="completed").length};
    const overdue=todos.filter(t=>t.due_date&&t.due_date<today()).length;
    const lateWorks=WORKS.filter(w=>w.status!=="completed"&&w.expected_end&&w.expected_end<today()).length;
    const unbilled=SITES.filter(x=>st(x)==="completed"&&!x.invoice_submitted).length;

    $("dBoard").innerHTML =
      stat(SITES.length,"Total projects")+
      stat(counts.ongoing,"Ongoing")+
      stat(n1(tNorm+tOt),"Total man-hours")+
      stat(menToday+" / "+sitesToday.size,"Men on site today / sites")+
      stat(pending.length,"Reports awaiting approval",pending.length?"warn":"good")+
      stat(todos.length,"Pending activities",overdue?"warn":"")+
      stat(reps.length,"Reports filed")+
      (seeCost()?stat(money(tCost),"Labour cost (range)"):stat(n1(tOt),"OT hours"));

    const alerts=[];
    if(pending.length) alerts.push([`${pending.length} report(s) waiting for you to approve or reject`,"reports"]);
    if(overdue) alerts.push([`${overdue} pending activity item(s) past their target date`,"todo"]);
    if(lateWorks) alerts.push([`${lateWorks} work(s) past the expected completion date`,"sites"]);
    if(unbilled) alerts.push([`${unbilled} completed project(s) with no invoice submitted`,"sites"]);
    const noRate=WORKERS.filter(w=>!w.trade).length;
    if(noRate) alerts.push([`${noRate} worker(s) with no designation — their hours cost nothing`,"workers"]);
    $("dAttention").innerHTML = alerts.length?`<div class="card" style="margin-top:4px;border-left:3px solid var(--amber)">
      <h3 style="font-size:16px;margin-bottom:10px">Needs attention</h3>
      ${alerts.map(([t,k])=>`<div class="todo"><div style="flex:1"><div class="tt">${t}</div></div>
        <button class="btn sec sm" data-goto="${k}">Open</button></div>`).join("")}</div>`:"";
    $("dAttention").querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>openTab(b.dataset.goto));

    $("dChips").innerHTML=[["active","Ongoing ("+counts.ongoing+")"],["to_start","Yet to start ("+counts.to_start+")"],
      ["completed","Completed ("+counts.completed+")"],["all","All ("+SITES.length+")"]]
      .map(([k,l])=>`<button data-f="${k}" class="${filter===k?"on":""}">${l}</button>`).join("");
    $("dChips").querySelectorAll("[data-f]").forEach(bt=>bt.onclick=()=>{ filter=bt.dataset.f; render(); });

    const want=x=>filter==="all"||(filter==="active"?st(x)==="ongoing":st(x)===filter);
    $("dSites").innerHTML = SITES.filter(want).map(x=>{
      const d=by[x.id], state=st(x);
      const lbl={to_start:"Yet to start",ongoing:"Ongoing",completed:"Completed"}[state];
      const head=`${x.code?`<span class="code">${esc(x.code)}</span> `:""}<span class="pill ${state==="ongoing"?"ongoing2":state}">${lbl}</span>`;
      if(!d) return `<div class="card sitecard">${head}<h3 style="margin-top:8px">${esc(x.name)}</h3>
        <div class="muted" style="font-size:13px">${esc(x.client_name||"")}</div>
        ${state==="completed"?closeoutLine(x):`<p class="muted" style="margin-top:8px">No reports in this range.</p>`}</div>`;
      const latest=d.reps.find(r=>(r.progress_note||"").trim());
      const mats=Object.entries(d.mats).slice(0,6).map(([k,v])=>`${esc(k)}: <span class="mono">${n1(v)}</span>`).join(" · ");
      return `<div class="card sitecard">${head}
        <h3 style="margin-top:8px">${esc(x.name)}</h3>
        <div class="muted" style="font-size:13px">${esc(x.client_name||"")} · last report ${fmtD(d.last)}</div>
        <div class="kv">
          <div><b>${n1(d.normH+d.otH)}</b><span>man-hours</span></div>
          <div><b>${n1(d.otH)}</b><span>OT hours</span></div>
          <div><b>${d.reps.length}</b><span>reports</span></div>
          ${seeCost()?`<div><b>${money(d.cost)}</b><span>labour cost</span></div>`:""}
        </div>
        ${state==="completed"?closeoutLine(x):""}
        ${mats?`<div class="note" style="border-left-color:var(--blue)"><b style="font-size:12px">Materials</b><br>${mats}</div>`:""}
        ${latest?`<div class="note"><b style="font-size:12px">Latest progress · ${fmtD(latest.report_date)}</b><br>${esc(latest.progress_note)}</div>`:""}
      </div>`;
    }).join("") || `<p class="muted">No projects in this view.</p>`;
  }
  function stat(v,l,cls){ return `<div class="stat ${cls||""}"><div class="v">${v}</div><div class="l">${l}</div></div>`; }
}
function closeoutLine(x){
  const y=(ok,l,d)=>`<span class="pill ${ok?"approved":"pending"}">${l}: ${ok?(d?fmtD(d):"yes"):"not yet"}</span>`;
  return `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
    ${y(x.jcc_submitted,"JCC",x.jcc_date)}${y(x.invoice_submitted,"Invoice",x.invoice_date)}</div>`;
}

/* wires approve / reject / edit / delete + loads signed photo URLs */
function wireRepActions(root,refresh,reps){
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this report? This cannot be undone."))return;
    const r=(reps||[]).find(x=>x.id===b.dataset.del);
    const paths=((r&&r.photos)||[]).map(p=>p.path).filter(Boolean);
    if(paths.length) await sb.storage.from(PHOTO_BUCKET).remove(paths);
    await sb.from("daily_reports").delete().eq("id",b.dataset.del); refresh();
  });
  root.querySelectorAll("[data-appr]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const {error}=await sb.from("daily_reports").update({status:"approved",reviewed_by:ME.id,reviewed_at:new Date().toISOString(),review_note:null}).eq("id",b.dataset.appr);
    if(error) alert(error.message); refresh();
  });
  root.querySelectorAll("[data-rej]").forEach(b=>b.onclick=async()=>{
    const note=prompt("Reason for rejection (the supervisor will see this and can correct the report):");
    if(note===null) return;
    b.disabled=true;
    const {error}=await sb.from("daily_reports").update({status:"rejected",reviewed_by:ME.id,reviewed_at:new Date().toISOString(),review_note:note}).eq("id",b.dataset.rej);
    if(error) alert(error.message); refresh();
  });
  root.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const r=(reps||[]).find(x=>x.id===b.dataset.edit);
    if(r) openTab("entry",r);
  });
  hydratePhotos(root,reps);
}
async function hydratePhotos(root,reps){
  const boxes=[...root.querySelectorAll("[data-ph]")]; if(!boxes.length) return;
  const paths=[]; boxes.forEach(bx=>{
    const r=(reps||[]).find(x=>x.id===bx.dataset.ph);
    ((r&&r.photos)||[]).forEach(p=>p.path&&paths.push(p.path));
  });
  if(!paths.length) return;
  const {data,error}=await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths,3600);
  const map={}; if(!error)(data||[]).forEach(d=>{ if(d.signedUrl) map[d.path]=d.signedUrl; });
  boxes.forEach(bx=>{
    const r=(reps||[]).find(x=>x.id===bx.dataset.ph);
    bx.innerHTML=((r&&r.photos)||[]).map(p=>map[p.path]
      ?`<div class="thumb"><a href="${map[p.path]}" target="_blank" rel="noopener"><img loading="lazy" src="${map[p.path]}" alt="${esc(p.name||"site photo")}"></a></div>`
      :`<div class="thumb muted" style="padding:10px;font-size:11px">unavailable</div>`).join("");
  });
}

/* ================= SHARED EXCEL IMPORTER ================= */
/* One workbook, up to three sheets: Manpower, Materials, Equipment.
   forcedSiteId, when given, overrides the Project column on every row. */
function xlDate(v){
  if(v==null||v==="") return null;
  if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); if(!d)return null;
    return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
  const t=String(v).trim();
  let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
  if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return null;
}
const cellOf=(row,key)=>{ const k=Object.keys(row).find(x=>x.toLowerCase().trim().startsWith(key)); return k?row[k]:""; };

function buildTemplate(){
  const wb=XLSX.utils.book_new();
  const mp=[["Date","Project","Work","Trade","Men","Normal Hours","OT Hours","Prem Hours","Holiday (Y/N)","Remarks"],
    ["01/07/2026","PCS Ayer Merbau","Flare Shelter","General Labourer",6,8,2,0,"N","Blasting & priming"],
    ["01/07/2026","PCS Ayer Merbau","Flare Shelter","Supervisor",1,8,2,0,"N",""]];
  const mt=[["Date","Project","Work","Material","Qty","Unit","Remarks"],
    ["01/07/2026","PCS Ayer Merbau","Flare Shelter","Jotun primer",12,"L","DO 44821"]];
  const eq=[["Date","Project","Work","Equipment","Qty","Hours","Remarks"],
    ["01/07/2026","PCS Ayer Merbau","Flare Shelter","Scissor lift",1,8,"On hire"]];
  const add=(rows,name,widths)=>{ const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=widths.map(w=>({wch:w})); XLSX.utils.book_append_sheet(wb,ws,name); };
  add(mp,"Manpower",[12,26,22,22,6,13,10,11,13,30]);
  add(mt,"Materials",[12,26,22,26,8,10,26]);
  add(eq,"Equipment",[12,26,22,26,8,9,26]);
  add([["Valid trades (exact spelling)"],...TRADES.filter(t=>t.active).map(t=>[t.name])],"Trades",[30]);
  add([["Projects already in SiteTrack"],...SITES.map(x=>[siteLabel(x)])],"Projects",[52]);
  XLSX.writeFile(wb,"SiteTrack_Import_Template.xlsx");
}

async function importWorkbook(buffer, forcedSiteId){
  const wb=XLSX.read(buffer);
  const sheet=n=>{ const key=wb.SheetNames.find(x=>x.toLowerCase()===n); return key?XLSX.utils.sheet_to_json(wb.Sheets[key],{defval:""}):[]; };
  let mpRows=sheet("manpower");
  /* a single unnamed sheet is treated as manpower, as the old template was */
  if(!mpRows.length && !sheet("materials").length && !sheet("equipment").length)
    mpRows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});
  const mtRows=sheet("materials"), eqRows=sheet("equipment");
  if(!mpRows.length && !mtRows.length && !eqRows.length) throw new Error("No data rows found in Manpower, Materials or Equipment.");

  const forcedName = forcedSiteId ? siteName(forcedSiteId) : "";
  const errs=[]; const items=[];
  const push=(kind,rows)=>rows.forEach((r,i)=>{
    const date=xlDate(cellOf(r,"date"));
    const proj=forcedName||String(cellOf(r,"project")).trim();
    const name=String(cellOf(r,kind==="mp"?"trade":kind==="mt"?"material":"equip")).trim();
    if(!date||!proj||!name){ if(String(cellOf(r,"project"))||name) errs.push(`${kind} row ${i+2}`); return; }
    items.push({kind,date,proj,work:String(cellOf(r,"work")).trim(),name,
      qty:+cellOf(r,kind==="mp"?"men":"qty")||0,
      nh:+cellOf(r,"normal")||+SET.std_hours, oh:+cellOf(r,"ot")||0, ph:+cellOf(r,"prem")||0,
      unit:String(cellOf(r,"unit")).trim(), hours:+cellOf(r,"hours")||0,
      hol:/^y/i.test(String(cellOf(r,"holiday")).trim()), rem:String(cellOf(r,"remarks")).trim()});
  });
  push("mp",mpRows); push("mt",mtRows); push("eq",eqRows);
  if(!items.length) throw new Error("No valid rows. Check that Date, Project and the item column are filled.");

  /* create any project, work or trade the sheet mentions but the app does not have */
  for(const pn of [...new Set(items.map(x=>x.proj))]){
    if(!SITES.find(x=>x.name.toLowerCase()===pn.toLowerCase())){
      const {data,error}=await sb.from("sites").insert({name:pn}).select().single();
      if(error) throw error; SITES.push(data);
    }
  }
  for(const it of items){
    if(!it.work) continue;
    const site=SITES.find(x=>x.name.toLowerCase()===it.proj.toLowerCase());
    if(!WORKS.find(w=>w.site_id===site.id&&w.name.toLowerCase()===it.work.toLowerCase())){
      const {data,error}=await sb.from("work_items").insert({site_id:site.id,name:it.work}).select().single();
      if(error) throw error; WORKS.push(data);
    }
  }
  for(const tn of [...new Set(items.filter(x=>x.kind==="mp").map(x=>x.name))]){
    if(!TRADES.find(t=>t.name.toLowerCase()===tn.toLowerCase())){
      const {data,error}=await sb.from("trades").insert({name:tn}).select().single();
      if(error) throw error; TRADES.push(data);
    }
  }
  /* one daily report per date + project + work + holiday flag */
  const groups={};
  items.forEach(it=>{
    const site=SITES.find(x=>x.name.toLowerCase()===it.proj.toLowerCase());
    const work=it.work?WORKS.find(w=>w.site_id===site.id&&w.name.toLowerCase()===it.work.toLowerCase()):null;
    const key=[it.date,site.id,work?work.id:"",it.hol].join("|");
    const g=(groups[key]=groups[key]||{report_date:it.date,site_id:site.id,work_item_id:work?work.id:null,
      supervisor_id:ME.id,is_holiday:it.hol,status:"approved",reviewed_by:ME.id,reviewed_at:new Date().toISOString(),
      manpower:[],materials:[],equipment:[],progress_note:""});
    if(it.kind==="mp"){ const t=TRADES.find(x=>x.name.toLowerCase()===it.name.toLowerCase());
      g.manpower.push({trade:t.name,count:it.qty,norm_hours:it.nh,ot_hours:it.oh,prem_hours:it.ph}); }
    else if(it.kind==="mt") g.materials.push({name:it.name,qty:it.qty,unit:it.unit});
    else g.equipment.push({name:it.name,qty:it.qty,hours:it.hours});
    if(it.rem) g.progress_note = g.progress_note ? g.progress_note+"; "+it.rem : it.rem;
  });
  const payloads=Object.values(groups).filter(g=>g.manpower.length||g.materials.length||g.equipment.length);
  for(let i=0;i<payloads.length;i+=50){
    const {error}=await sb.from("daily_reports").insert(payloads.slice(i,i+50));
    if(error) throw error;
  }
  const n=k=>items.filter(x=>x.kind===k).length;
  return `Imported ${n("mp")} manpower, ${n("mt")} material and ${n("eq")} equipment row(s) as ${payloads.length} dated record(s)`
    + (forcedName?` on ${esc(forcedName)}`:` across ${[...new Set(items.map(x=>x.proj))].length} project(s)`)
    + `.${errs.length?` ${errs.length} row(s) skipped for missing Date, Project or name.`:""}`;
}

/* ---------- photo helpers ---------- */
async function shrink(file,max,q){
  max=max||1400; q=q||0.68;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(res,"image/jpeg",q));
  }catch(e){ return file; }
  finally{ URL.revokeObjectURL(url); }
}
const b2d = blob => new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
function d2b(dataUrl){
  const [head,body]=dataUrl.split(","); const mime=(head.match(/:(.*?);/)||[])[1]||"image/jpeg";
  const bin=atob(body); const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime});
}
const rndName = () => (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2))+".jpg";

/* ---------- offline queue ---------- */
function qGet(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]"); }catch(e){ return []; } }
function qSet(v){ try{ localStorage.setItem(QUEUE_KEY,JSON.stringify(v)); }catch(e){} }
function netBar(msg,cls){
  let b=$("offBar");
  if(!b){ b=document.createElement("div"); b.id="offBar"; document.body.appendChild(b); }
  if(!msg){ b.style.display="none"; return; }
  b.className="offbar"+(cls?" "+cls:""); b.textContent=msg; b.style.display="block";
}
function netStatus(){
  const q=qGet().length;
  if(!navigator.onLine) netBar(`Offline — reports are saved on this device and sent automatically when signal returns.${q?` (${q} waiting)`:""}`);
  else if(q) netBar(`${q} report(s) waiting to sync…`);
  else netBar("");
}
async function queueReport(payload,photos){
  const ph=[]; let bytes=0, skipped=0;
  for(const p of photos){
    const d=await b2d(p.blob);
    if(bytes+d.length>2600000 || ph.length>=4){ skipped++; continue; }
    bytes+=d.length; ph.push({name:p.name,data:d});
  }
  const q=qGet(); q.push({payload,photos:ph,at:Date.now()}); qSet(q); netStatus();
  return skipped;
}
async function flushQueue(){
  if(!ME||!navigator.onLine) return 0;
  let q=qGet(); if(!q.length) return 0;
  netBar(`Syncing ${q.length} saved report(s)…`,"sync");
  const left=[]; let done=0;
  for(const item of q){
    try{
      const photos=(item.photos||[]).map(p=>({name:p.name,blob:d2b(p.data)}));
      const {error}=await pushReport(item.payload,photos,[],null);
      if(error) throw error;
      done++;
    }catch(e){ left.push(item); }
  }
  qSet(left);
  netBar(done?`${done} report(s) synced.`:"","sync");
  setTimeout(netStatus,2500);
  return done;
}
/* single write path used by the form and by the queue */
async function pushReport(payload,newPhotos,keep,editId){
  const uploaded=[];
  for(const p of (newPhotos||[])){
    const path=`${payload.site_id}/${payload.report_date}/${rndName()}`;
    const {error}=await sb.storage.from(PHOTO_BUCKET).upload(path,p.blob,{contentType:"image/jpeg"});
    if(error) return {error};
    uploaded.push({path,name:p.name});
  }
  const shots=(keep||[]).concat(uploaded);
  const body=Object.assign({},payload,shots.length?{photos:shots}:{});
  const write = b => editId ? sb.from("daily_reports").update(b).eq("id",editId)
                            : sb.from("daily_reports").insert(b);
  let res=await write(body);
  /* photos are optional — if the column is not there yet, save the report anyway */
  if(res.error && /photos|meta/i.test(res.error.message||"")){
    const b2=Object.assign({},body);
    const dropped=[];
    if(/photos/i.test(res.error.message)){ delete b2.photos; dropped.push("photos"); }
    if(/meta/i.test(res.error.message)){ delete b2.meta; dropped.push("times and progress"); }
    res=await write(b2);
    if(!res.error) res.warn="Report saved, but "+dropped.join(" and ")+" could not be stored — run the update on the Setup tab.";
  }
  return res;
}

/* the daily report drives the work item's own status and dates */
async function syncWorkItem(payload){
  const id=payload.work_item_id, m=payload.meta||{};
  if(!id) return;
  const w=WORKS.find(x=>x.id===id); if(!w) return;
  const up={};
  if(m.work_status && m.work_status!==w.status) up.status=m.work_status;
  if(m.progress_pct!=null && +m.progress_pct!==+(w.progress_pct||0)) up.progress_pct=+m.progress_pct;
  if(m.expected_end && m.expected_end!==w.expected_end) up.expected_end=m.expected_end;
  const st=m.actual_start||w.start_date||payload.report_date;
  if(st!==w.start_date) up.start_date=st;
  if(m.work_status==="completed"){ up.end_date=m.actual_end||w.end_date||payload.report_date; if(up.progress_pct==null) up.progress_pct=100; }
  else if(w.end_date) up.end_date=null;
  if(!Object.keys(up).length) return;
  const {error}=await sb.from("work_items").update(up).eq("id",id);
  if(!error) await loadBase();
}

function collectForm(){

    }

/* hours between two clock times, minus the break; handles a night shift crossing midnight */
function spanHours(a,b,brk){
  if(!a||!b) return 0;
  const [h1,m1]=a.split(":").map(Number), [h2,m2]=b.split(":").map(Number);
  let mins=(h2*60+m2)-(h1*60+m1); if(mins<0) mins+=1440;
  return Math.max(0, mins/60 - (+brk||0));
}

    const files=[...e.target.files]; e.target.value="";

      if(KEEP.length+PHOTOS.length>=10){ alert("Maximum 10 photos per report."); break; }
      const blob=await shrink(f);
      PHOTOS.push({name:f.name,blob,url:URL.createObjectURL(blob)});
    }
    renderPhotos();
  };
  renderPhotos();

  /* save */
  $("eSave").onclick=async()=>{
    if(!$("eSite").value){ $("eMsg").innerHTML=`<div class="msg err">No active projects — add one first.</div>`; return; }
    const f=collectForm();
    if(!f.manpower.length){ $("eMsg").innerHTML=`<div class="msg err">${MPMODE==="worker"?"Select at least one worker.":"Add at least one manpower row (choose a trade and number of men)."}</div>`; return; }

      manpower:f.manpower, materials:f.materials, equipment:f.equipment, progress_note:f.progress_note,

    if(editing && editing.status==="rejected") payload.status="submitted";
    $("eSave").disabled=true; $("eMsg").innerHTML=`<div class="msg ok">Saving…</div>`;

    if(!navigator.onLine && !editing){
      const skipped=await queueReport(payload,PHOTOS);
      $("eSave").disabled=false; clearDraft();
      $("eMsg").innerHTML=`<div class="msg ok">No signal — report saved on this device and will be sent automatically when you are back online.${skipped?` ${skipped} photo(s) could not be held offline.`:""}</div>`;
      PHOTOS=[]; setTimeout(()=>openTab("entry"),1800); return;
    }
    let res;
    try{ res=await pushReport(payload,PHOTOS,KEEP,editing?editing.id:null); }
    catch(e){ res={error:{message:String(e.message||e)}}; }
    $("eSave").disabled=false;
    if(res.warn) $("eMsg").innerHTML=`<div class="msg err">${esc(res.warn)}</div>`;
    if(res.error){
      if(!editing && /fetch|network|Failed/i.test(res.error.message)){
        const skipped=await queueReport(payload,PHOTOS); clearDraft(); PHOTOS=[];
        $("eMsg").innerHTML=`<div class="msg ok">Connection lost — report saved on this device and queued.${skipped?` ${skipped} photo(s) skipped.`:""}</div>`;
        setTimeout(()=>openTab("entry"),1800); return;
      }
      $("eMsg").innerHTML=`<div class="msg err">${esc(res.error.message)}</div>`; return;
    }
    await syncWorkItem(payload);
    clearDraft();
    if(editing){ $("eMsg").innerHTML=`<div class="msg ok">Report updated.</div>`; setTimeout(()=>openTab(ME.role==="admin"?"reports":"mine"),900); return; }
    $("eMsg").innerHTML=`<div class="msg ok">Report submitted for ${fmtD(payload.report_date)} — ${esc(siteName(payload.site_id))}. Pending office review.</div>`;
    PHOTOS=[]; KEEP=[];
    $("eNote").value="";
    const fs=$("main").querySelector('fieldset[data-kind="mp"]');
    fs.querySelector(".rowset").innerHTML = MPMODE==="worker"?wkRow():mpRow();
    ["mat","eq"].forEach(k=>{ const f2=$("main").querySelector(`fieldset[data-kind="${k}"]`); f2.querySelector(".rowset").innerHTML=""; wireRowset(f2); });
    wireRowset(fs); wireAllBtn(); renderPhotos();
  };
}

      if(error) $("wMsg").innerHTML=`<div class="msg err">${esc(error.message)} — only an admin can change this.</div>`;
      else await loadBase();
    });
    if(!admin) return;
    $("wTbl").querySelectorAll("[data-wtog]").forEach(b=>b.onclick=async()=>{
      const w=workerById(b.dataset.wtog);
      await sb.from("workers").update({active:!w.active}).eq("id",w.id); await loadBase(); wTable();
    });
    $("wTbl").querySelectorAll("[data-wdel]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Remove this worker from the register? Past reports keep his name."))return;
      const {error}=await sb.from("workers").delete().eq("id",b.dataset.wdel);
      if(error) $("wMsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;
      await loadBase(); wTable();
    });
  }
  wTable();
  $("wAdd").onclick=async()=>{
    const name=$("wName").value.trim();
    if(!name) return $("wMsg").innerHTML=`<div class="msg err">Enter the worker's name.</div>`;
    const row={name, emp_no:$("wEmp").value.trim().toUpperCase()||null, trade:$("wTrade").value||null, site_id:$("wSite").value||null};
    if(admin) row.rate=+($("wRate").value||0)||0;
    const {error}=await sb.from("workers").insert(row);
    $("wMsg").innerHTML=error?`<div class="msg err">${esc(error.message)}</div>`:`<div class="msg ok">${esc(name)} added.</div>`;
    if(!error){ $("wName").value=""; $("wEmp").value=""; if($("wRate")) $("wRate").value=""; await loadBase(); wTable(); }
  };

  let ATT=[];
  async function att(){
    const reps=await fetchReports($("aFrom").value,$("aTo").value,$("aSite").value||null,{costable:true});
    const by={};
    reps.forEach(r=>{
      const dayM=r.is_holiday?+SET.holiday_multiplier:1, otEff=r.is_holiday?+SET.holiday_multiplier:+SET.ot_multiplier;
      (r.manpower||[]).forEach(m=>{
        if(!m.worker_id) return;
        const w=workerById(m.worker_id);
        const k=m.worker_id;
        const o=(by[k]=by[k]||{name:m.worker_name||(w?w.name:"(removed)"),emp:m.emp_no||(w&&w.emp_no)||"",trade:m.trade||(w?w.trade:""),days:0,norm:0,ot:0,prem:0,cost:0,sites:new Set()});
        const nh=+(m.norm_hours??m.hours)||0, oh=+m.ot_hours||0, ph=+m.prem_hours||0, rate=mpRate(m);
        o.days++; o.norm+=nh; o.ot+=oh; o.prem+=ph;
        o.cost+=rate*(nh*dayM+oh*otEff+ph*(+SET.holiday_multiplier));
        o.sites.add(siteCode(r.site_id)||siteName(r.site_id));
      });
    });
    ATT=Object.values(by).sort((a,b)=>b.norm+b.ot+b.prem-(a.norm+a.ot+a.prem));
    const tot=ATT.reduce((a,o)=>({d:a.d+o.days,n:a.n+o.norm,o:a.o+o.ot+o.prem,c:a.c+o.cost}),{d:0,n:0,o:0,c:0});
    $("aBody").innerHTML=ATT.length?`
      <div class="board">${[[ATT.length,"Workers on site"],[n1(tot.d),"Man-days"],[n1(tot.n+tot.o),"Man-hours"],[n1(tot.o),"OT hours"]]
        .concat(seeCost()?[[money(tot.c),"Labour cost"]]:[])
        .map(([v,l])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>
      <div class="tblwrap"><table class="tbl">
        <tr><th>ID</th><th>Worker</th><th>Designation</th><th>Projects</th><th style="text-align:right">Days</th><th style="text-align:right">Norm</th><th style="text-align:right">OT+Prem</th>${seeCost()?`<th style="text-align:right">Cost</th>`:""}</tr>
        ${ATT.map(o=>`<tr><td class="mono">${esc(o.emp||"—")}</td><td>${esc(o.name)}</td><td>${esc(o.trade||"—")}</td>
          <td style="font-size:12px">${esc([...o.sites].join(", "))}</td>
          <td class="num">${o.days}</td><td class="num">${n1(o.norm)}</td><td class="num">${n1(o.ot+o.prem)}</td>
          ${seeCost()?`<td class="num">${money(o.cost)}</td>`:""}</tr>`).join("")}
      </table></div>`
      :`<p class="muted">No named-worker attendance in this range.</p>`;
  }
  $("aGo").onclick=att; await att();
  $("aCsv").onclick=()=>{
    const head=["ID","Worker","Designation","Projects","Days","Norm hrs","OT 1.5 hrs","Prem 2.0 hrs"];
    if(seeCost()) head.push("Labour cost");
    const rows=[head].concat(ATT.map(o=>{
      const r=[o.emp,o.name,o.trade,[...o.sites].join(" / "),o.days,o.norm,o.ot,o.prem];
      if(seeCost()) r.push(o.cost.toFixed(2));
      return r;
    }));
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`attendance_${$("aFrom").value}_to_${$("aTo").value}.csv`; a.click();
  };
}

const PERM_ROWS=[
  ["costs","Money — rates, labour cost and totals","Every dollar figure in the app. Off means men and hours only."],
  ["entry","New daily report","Where the day's manpower, materials and equipment are entered."],
  ["mine","My reports","Their own past reports, with the office's approve or reject decision."],
  ["resources","Resources utilised","The day's men, materials and equipment across every project."],
  ["todo","To-do","Pending items per project. They can tick items done but never delete."],
  ["workers","Workers","The worker register and attendance summary."],
  ["addproj","Add project","Lets a supervisor open a new project themselves."]
];
async function vAccess(){
  const sups=PROFILES.filter(x=>x.role!=="admin");
  let who="";  /* "" = the default for every supervisor */
  const p=perms();
  $("main").innerHTML=`
    <h2 style="font-size:22px;margin-bottom:6px">Access</h2>
    <p class="muted" style="margin-bottom:18px;font-size:14px">Set what supervisors see. Start with the default that applies to everyone, then open a single person to give them something different. Admins always see everything, and changes take effect the next time that person opens the app.</p>
    <div class="card" style="margin-bottom:18px">
      <div style="max-width:420px;margin-bottom:16px">
        <label>Editing</label>
        <select id="pmWho">
          <option value="">Default for all supervisors</option>
          ${sups.map(x=>`<option value="${x.id}">${esc(x.full_name||"(no name)")}${x.perms?" — custom":""}</option>`).join("")}
        </select>
      </div>
      <table class="tbl" id="pmTbl">
        <tr><th>Can see</th><th style="width:74px;text-align:right">On</th></tr>
        ${PERM_ROWS.map(([k,lbl,note])=>`<tr>
          <td><div class="tt">${lbl}</div><div class="td-meta">${note}</div></td>
          <td style="text-align:right"><input type="checkbox" data-pm="${k}" ${p[k]?"checked":""} style="width:20px;height:20px;accent-color:var(--green)"></td>
        </tr>`).join("")}
      </table>
      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:16px">
        <button class="btn" id="pmSave">Save access</button>
        <button class="btn sec" id="pmSafe">Reset to safe defaults</button>
        <button class="btn sec hidden" id="pmClear">Use the default instead</button>
      </div>
      <div id="pmMsg"></div>
    </div>
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:8px">A note on how far this goes</h3>
      <p class="muted" style="font-size:13.5px">Turning money off hides it everywhere in the interface, and the database refuses to hand cost entries, variations or the P&amp;L to anyone who is not an admin. Rates sit alongside designation names, which supervisors need for the register, so a determined person with developer tools could still read a rate. If that matters for your site, keep the worker register admin-only and let supervisors enter by trade instead.</p>
    </div>`;
  function paint(){
    const person = who ? PROFILES.find(x=>x.id===who) : null;
    const eff = person ? perms(person) : Object.assign({},PERM_DEFAULT,(SET.perms&&SET.perms.supervisor)||{});
    $("pmTbl").querySelectorAll("[data-pm]").forEach(c=>c.checked=!!eff[c.dataset.pm]);
    $("pmClear").classList.toggle("hidden", !(person && person.perms));
    $("pmMsg").innerHTML = person
      ? `<div class="msg ok">Editing ${esc(person.full_name||"this person")} only. ${person.perms?"They currently have their own settings.":"They are on the default — saving here creates a setting just for them."}</div>`
      : "";
  }
  $("pmWho").onchange=()=>{ who=$("pmWho").value; paint(); };
  paint();
  $("pmSave").onclick=async()=>{
    const next={};
    $("pmTbl").querySelectorAll("[data-pm]").forEach(c=>next[c.dataset.pm]=c.checked);
    let error;
    if(who){
      ({error}=await sb.from("profiles").update({perms:next}).eq("id",who));
    }else{
      const merged=Object.assign({},SET.perms||{},{supervisor:Object.assign({},PERM_DEFAULT,next)});
      ({error}=await sb.from("settings").update({perms:merged}).eq("id",1));
    }
    if(error){ $("pmMsg").innerHTML=`<div class="msg err">${esc(error.message)} — if it mentions perms, run the update on the Setup tab first.</div>`; return; }
    await loadBase();
    const nm = who ? (PROFILES.find(x=>x.id===who)||{}).full_name : "";
    $("pmMsg").innerHTML=`<div class="msg ok">Saved${nm?" for "+esc(nm):" as the default"}. ${next.costs?"Costing is visible.":"No costing is visible."}</div>`;
  };
  $("pmClear").onclick=async()=>{
    if(!who) return;
    const {error}=await sb.from("profiles").update({perms:null}).eq("id",who);
    if(error){ $("pmMsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
    await loadBase(); paint();
    $("pmMsg").innerHTML=`<div class="msg ok">Custom settings removed — this person follows the default again.</div>`;
  };
  $("pmSafe").onclick=()=>{
    $("pmTbl").querySelectorAll("[data-pm]").forEach(c=>c.checked=!!PERM_DEFAULT[c.dataset.pm]);
    void 0;
    $("pmMsg").innerHTML=`<div class="msg ok">Defaults restored on screen — press Save access to apply.</div>`;
  };
}

/* ================= PURCHASE ORDERS → MATERIAL COST ================= */
const UOMS="LS|NOS|NO|PCS|PC|EA|SET|SETS|BOX|LOT|KG|MT|M|M2|M3|LTR|L|ROLL|BAG|BAGS|DRUM|PAIL|TIN|CTN|UNIT";
function parsePO(text){
  const t=text.replace(/\r/g,"");
  const one=t.replace(/\n+/g," \n ");
  const grab=(re,d)=>{ const m=one.match(re); return m?m[1].trim():(d||""); };
  const nums=[...t.matchAll(/TOTAL\s*\$?\s*([\d,]+\.\d{2})/gi)].map(m=>+m[1].replace(/,/g,""));
  const gstM=t.match(/GST[^\n$]*\$?\s*([\d,]+\.\d{2})/i);
  const items=[];
  const re=new RegExp("([\\s\\S]{0,160}?)([\\d,]+\\.\\d{2})\\s+("+UOMS+")\\s+([\\d,]+\\.\\d{2})(?:\\s+[\\d,.%]+)?\\s+([\\d,]+\\.\\d{2})","gi");
  let m; while((m=re.exec(t))){
    let desc=m[1].replace(/\s+/g," ");
    /* drop the column headings and the line number that sit in front of the description */
    const cut=desc.toUpperCase().lastIndexOf("AMOUNT");
    if(cut>=0) desc=desc.slice(cut+6);
    desc=desc.replace(/^[\s|]*\d{1,3}[\s.)]+/,"").replace(/^(NO|PICTURE|DESCRIPTION|QTY|UOM|UNIT PRICE|DISCOUNT)\b\s*/gi,"").trim();
    items.push({desc:desc.slice(0,140), qty:+m[2].replace(/,/g,""), uom:m[3].toUpperCase(),
      unit:+m[4].replace(/,/g,""), amount:+m[5].replace(/,/g,"")});
  }
  const remarks=(t.match(/REMARKS:?\s*([\s\S]{0,180})/i)||[])[1]||"";
  return {
    po: grab(/ORDER\s*NO\.?\s*:?\s*([A-Z0-9][A-Z0-9\- ]*?(?:\s*R\d+)?)\s*(?:\n|ORDER\s*DATE)/i),
    date: grab(/ORDER\s*DATE\s*:?\s*(\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4})/i),
    supplier: grab(/SEND\s*TO\s*:?\s*([^\n]{3,70})/i),
    projectNo: grab(/\b(PJOR\s*\d{4,})\b/i) || grab(/SO\/?PROJECT\s*NO\.?\s*:?\s*([A-Z]{2,}[A-Z0-9\-\/]{2,})/i),
    ref: grab(/(VQ-[A-Z0-9]+)/i),
    site: grab(/SHIPMENT\s*ADDRESS[^\n]*\n?\s*([^\n]{5,60})/i),
    total: nums.length?Math.max(...nums):0,
    gst: gstM?+gstM[1].replace(/,/g,""):0,
    items, remarks:remarks.replace(/\s+/g," ").trim()
  };
}
async function pdfText(file){
  const buf=await file.arrayBuffer();
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  let out="";
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i), c=await pg.getTextContent();
    let lastY=null, line="";
    c.items.forEach(it=>{
      const y=Math.round(it.transform[5]);
      if(lastY!==null && Math.abs(y-lastY)>3){ out+=line.trim()+"\n"; line=""; }
      line+=it.str+" "; lastY=y;
    });
    out+=line.trim()+"\n";
  }
  return out;
}
function guessSite(po){
  const hay=[po.projectNo,po.ref,po.remarks,po.site].join(" ").toUpperCase();
  let best=null;
  SITES.forEach(x=>{
    const code=(x.code||"").toUpperCase();
    if(code && hay.includes(code)) best=best||x;
  });
  if(!best) SITES.forEach(x=>{
    const words=(x.name||"").toUpperCase().split(/[^A-Z0-9]+/).filter(w=>w.length>4);
    if(words.some(w=>hay.includes(w))) best=best||x;
  });
  return best;
}

      </table></div>`:`<p class="muted">Nothing booked from a PO yet.</p>`}`;
    $("poList").querySelectorAll("[data-pod]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Remove this cost entry?"))return;
      await sb.from("project_costs").delete().eq("id",b.dataset.pod); listPOs();
    });
  }
}

/* ================= RESOURCES UTILISED ================= */
async function vResources(){
  $("main").innerHTML=`
    <h2 style="font-size:22px;margin-bottom:6px">Resources utilised</h2>
    <p class="muted" style="margin-bottom:18px;font-size:14px">Everything booked on a given day — who was on site, what was used and what plant ran, across every project.</p>
    <div class="flexbar">
      <div><label>Date</label><input type="date" id="reDate" value="${today()}"></div>
      <div style="min-width:220px"><label>Project</label><select id="reSite"><option value="">All projects</option>${SITES.map(x=>`<option value="${x.id}">${esc(siteLabel(x))}</option>`).join("")}</select></div>
      <button class="btn sm" id="reGo">Show</button>
      <button class="btn sec sm" id="rePrev">◀ Previous day</button>
      <button class="btn sec sm" id="reToday">Today</button>
      <button class="btn sec sm" id="reNext">Next day ▶</button>
      <button class="btn sec sm" id="reCsv">Export CSV</button>
    </div>
    <div id="reBody"></div>`;

  const shift=n=>{ const d=new Date($("reDate").value+"T00:00:00"); d.setDate(d.getDate()+n);
    $("reDate").value=d.toISOString().slice(0,10); render(); };
  $("reGo").onclick=render; $("reDate").onchange=render;
  $("rePrev").onclick=()=>shift(-1); $("reNext").onclick=()=>shift(1);
  $("reToday").onclick=()=>{ $("reDate").value=today(); render(); };

  let FLAT=[];
  async function render(){
    const d=$("reDate").value;
    const reps=await fetchReports(d,d,$("reSite").value||null,{costable:true});
    if(!reps.length){
      FLAT=[];
      $("reBody").innerHTML=`<div class="card"><p class="muted">Nothing booked on ${fmtD(d)}. Either no work ran, or the reports have not been submitted yet.</p></div>`;
      return;
    }
    /* totals across the whole day */
    let men=0,hrs=0,cost=0; const byTrade={}, mats={}, eqp={}, sites={};
    reps.forEach(r=>{
      const c=repCalc(r); men+=c.men; hrs+=c.hrs; cost+=c.cost;
      const S=(sites[r.site_id]=sites[r.site_id]||{men:0,hrs:0,cost:0,trades:{},named:[],mats:[],eqp:[],works:[],notes:[]});
      S.men+=c.men; S.hrs+=c.hrs; S.cost+=c.cost;
      const m2=r.meta||{};
      S.works.push({work:workName(r.work_item_id),stage:{to_start:"To be started",ongoing:"In progress",completed:"Completed"}[m2.work_status]||"",
        pct:m2.progress_pct, time:(m2.start_time&&m2.end_time)?`${m2.start_time}–${m2.end_time}`:"", driver:m2.driver||"", sup:profName(r.supervisor_id)});
      if(r.progress_note) S.notes.push(r.progress_note);
      (r.manpower||[]).forEach(m=>{
        const cnt=+m.count||0, h=cnt*((+(m.norm_hours??m.hours)||0)+(+m.ot_hours||0)+(+m.prem_hours||0));
        const t=m.trade||"Not set";
        byTrade[t]=(byTrade[t]||{men:0,hrs:0}); byTrade[t].men+=cnt; byTrade[t].hrs+=h;
        S.trades[t]=(S.trades[t]||{men:0,hrs:0}); S.trades[t].men+=cnt; S.trades[t].hrs+=h;
        if(m.worker_id) S.named.push({emp:m.emp_no||"",name:m.worker_name||"",trade:t,
          nh:+(m.norm_hours??m.hours)||0,oh:+m.ot_hours||0,ph:+m.prem_hours||0});
        FLAT.push(["Manpower",siteCode(r.site_id)||siteName(r.site_id),m.worker_name||t,t,cnt,h,""]);
      });
      (r.materials||[]).forEach(x=>{
        const k=(x.name||"").trim()+"||"+(x.unit||"");
        mats[k]=(mats[k]||0)+(+x.qty||0);
        S.mats.push(x); FLAT.push(["Material",siteCode(r.site_id)||siteName(r.site_id),x.name,"",+x.qty||0,"",x.unit||""]);
      });
      (r.equipment||[]).forEach(x=>{
        const k=(x.name||"").trim();
        eqp[k]=eqp[k]||{qty:0,hrs:0}; eqp[k].qty+=(+x.qty||0); eqp[k].hrs+=(+x.hours||0);
        S.eqp.push(x); FLAT.push(["Equipment",siteCode(r.site_id)||siteName(r.site_id),x.name,"",+x.qty||0,+x.hours||0,""]);
      });
    });

    const stat=(v,l)=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`;
    const matRows=Object.entries(mats).map(([k,q])=>{const [n,u]=k.split("||");return `<tr><td>${esc(n)}</td><td class="num">${n1(q)}</td><td>${esc(u||"")}</td></tr>`;}).join("");
    const eqRows=Object.entries(eqp).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="num">${n1(v.qty)}</td><td class="num">${v.hrs?n1(v.hrs):""}</td></tr>`).join("");

    $("reBody").innerHTML=`
      <div class="board">
        ${stat(Object.keys(sites).length,"Projects running")}
        ${stat(men,"Men deployed")}
        ${stat(n1(hrs),"Man-hours")}
        ${stat(Object.keys(eqp).length,"Equipment items")}
        ${seeCost()?stat(money(cost),"Labour cost"):""}
      </div>
      <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start;margin-bottom:18px">
        <div class="card"><h3 style="font-size:16px;margin-bottom:10px">Manpower by designation</h3>
          <div class="tblwrap"><table class="tbl">
            <tr><th>Designation</th><th style="text-align:right">Men</th><th style="text-align:right">Man-hours</th></tr>
            ${Object.entries(byTrade).sort((a,b)=>b[1].men-a[1].men).map(([t,v])=>
              `<tr><td>${esc(t)}${t==="Not set"?` <span class="pill rejected">no rate</span>`:""}</td><td class="num">${v.men}</td><td class="num">${n1(v.hrs)}</td></tr>`).join("")}
            <tfoot><tr><td>Total</td><td class="num">${men}</td><td class="num">${n1(hrs)}</td></tr></tfoot>
          </table></div></div>
        <div class="card"><h3 style="font-size:16px;margin-bottom:10px">Materials &amp; equipment</h3>
          ${matRows?`<div class="tblwrap" style="margin-bottom:14px"><table class="tbl">
            <tr><th>Material</th><th style="text-align:right">Qty</th><th>Unit</th></tr>${matRows}</table></div>`:`<p class="muted" style="font-size:13.5px;margin-bottom:12px">No materials recorded.</p>`}
          ${eqRows?`<div class="tblwrap"><table class="tbl">
            <tr><th>Equipment</th><th style="text-align:right">Qty</th><th style="text-align:right">Hours</th></tr>${eqRows}</table></div>`:`<p class="muted" style="font-size:13.5px">No equipment recorded.</p>`}
        </div>
      </div>
      ${Object.keys(sites).map(sid=>{const S=sites[sid];return `
        <div class="card" style="margin-bottom:14px">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
            ${siteCode(sid)?`<span class="code">${esc(siteCode(sid))}</span>`:""}
            <h3 style="font-size:17px">${esc(siteName(sid))}</h3>
            <span class="muted" style="font-size:13px">${S.men} men · ${n1(S.hrs)} man-hours${seeCost()?` · ${money(S.cost)}`:""}</span>
          </div>
          <div class="tblwrap" style="margin-bottom:12px"><table class="tbl">
            <tr><th>Work</th><th>Stage</th><th style="text-align:right">Progress</th><th>Time on site</th><th>Lorry driver</th><th>Supervisor</th></tr>
            ${S.works.map(w=>`<tr><td>${esc(w.work)}</td><td>${esc(w.stage||"—")}</td>
              <td class="num">${w.pct!=null?w.pct+"%":"—"}</td><td class="mono">${esc(w.time||"—")}</td>
              <td>${esc(w.driver||"—")}</td><td>${esc(w.sup)}</td></tr>`).join("")}
          </table></div>
          ${S.named.length?`<div class="tblwrap" style="margin-bottom:12px"><table class="tbl">
            <tr><th>ID</th><th>Worker</th><th>Designation</th><th style="text-align:right">Norm</th><th style="text-align:right">OT 1.5</th><th style="text-align:right">Prem 2.0</th></tr>
            ${S.named.map(w=>`<tr><td class="mono">${esc(w.emp||"—")}</td><td>${esc(w.name)}</td><td>${esc(w.trade)}</td>
              <td class="num">${w.nh}</td><td class="num">${w.oh||""}</td><td class="num">${w.ph||""}</td></tr>`).join("")}
          </table></div>`:`<p class="muted" style="font-size:13px;margin-bottom:10px">Entered by trade count — ${Object.entries(S.trades).map(([t,v])=>`${v.men} × ${esc(t)}`).join(", ")}.</p>`}
          ${(S.mats.length||S.eqp.length)?`<div class="f2">
            <div>${S.mats.length?`<b style="font-size:13px">Materials</b><ul style="font-size:13.5px;padding-left:18px;margin-top:5px">${S.mats.map(m=>`<li>${esc(m.name)} — ${n1(m.qty)} ${esc(m.unit||"")}</li>`).join("")}</ul>`:""}</div>
            <div>${S.eqp.length?`<b style="font-size:13px">Equipment</b><ul style="font-size:13.5px;padding-left:18px;margin-top:5px">${S.eqp.map(m=>`<li>${esc(m.name)} — ${n1(m.qty)}${m.hours?` · ${n1(m.hours)} hrs`:""}</li>`).join("")}</ul>`:""}</div>
          </div>`:""}
          ${S.notes.length?`<div class="note">${S.notes.map(esc).join("<br>")}</div>`:""}
        </div>`;}).join("")}`;
  }
  $("reCsv").onclick=()=>{
    if(!FLAT.length) return;
    const rows=[["Type","Project","Item","Designation","Qty / men","Hours","Unit"]].concat(FLAT);
    const csv=rows.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`resources_${$("reDate").value}.csv`; a.click();
  };
  await render();
}

/* ================= PENDING / TO-DO PER PROJECT ================= */
async function vTodo(){
  const admin=ME.role==="admin";
  const act=SITES.filter(x=>x.active);
  $("main").innerHTML=`
    <div class="card" style="margin-bottom:16px">
      <h2 style="font-size:18px;margin-bottom:12px">Add a pending item</h2>
      <div class="f3" style="margin-bottom:10px">
        <div><label>Project</label><select id="tdSite">${act.map(x=>`<option value="${x.id}">${esc(siteLabel(x))}</option>`).join("")}</select></div>
        <div><label>Target date</label><input type="date" id="tdDue"></div>
        <div><label>Priority</label><select id="tdPri"><option value="normal">Normal</option><option value="high">Urgent</option><option value="low">Low</option></select></div>
      </div>
      <div class="f2" style="margin-bottom:10px">
        <div><label>What is pending</label><input id="tdTitle" placeholder="e.g. Submit RA/MS for tank farm painting"></div>
        <div><label>Assign to</label><select id="tdWho"><option value="">— anyone —</option>${PROFILES.filter(x=>x.active).map(x=>`<option value="${x.id}">${esc(x.full_name||"(no name)")}</option>`).join("")}</select></div>
      </div>
      <div style="margin-bottom:10px"><label>Detail (optional)</label><input id="tdDet" placeholder="Reference, contact person, what is blocking it"></div>
      <button class="btn" id="tdAdd">Add to list</button><div id="tdMsg"></div>
    </div>
    <div class="flexbar" style="margin-bottom:12px">
      <div style="min-width:220px"><label>Show project</label><select id="tdFil"><option value="">All projects</option>${SITES.map(x=>`<option value="${x.id}">${esc(siteLabel(x))}</option>`).join("")}</select></div>
      <div class="checkline" style="min-width:auto"><input type="checkbox" id="tdDone"><label for="tdDone" style="margin:0;text-transform:none;font-size:13px;color:var(--text)">Show completed</label></div>
    </div>
    <div id="tdList"></div>`;

  $("tdAdd").onclick=async()=>{
    const title=$("tdTitle").value.trim();
    if(!title) return $("tdMsg").innerHTML=`<div class="msg err">Write what is pending.</div>`;
    const {error}=await sb.from("todos").insert({
      site_id:$("tdSite").value||null, title, detail:$("tdDet").value.trim()||null,
      due_date:$("tdDue").value||null, priority:$("tdPri").value, assigned_to:$("tdWho").value||null});
    if(error) return $("tdMsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;
    $("tdTitle").value=""; $("tdDet").value=""; $("tdMsg").innerHTML=`<div class="msg ok">Added.</div>`;
    render();
  };
  $("tdFil").onchange=render; $("tdDone").onchange=render;

  async function render(){
    let q=sb.from("todos").select("*").order("due_date",{ascending:true,nullsFirst:false}).order("created_at",{ascending:false});
    if($("tdFil").value) q=q.eq("site_id",$("tdFil").value);
    if(!$("tdDone").checked) q=q.eq("status","open");
    const {data,error}=await q;
    if(error){ $("tdList").innerHTML=`<div class="msg err">${esc(error.message)} — run upgrade_v5.sql in Supabase.</div>`; return; }
    const rows=data||[];
    if(!rows.length){ $("tdList").innerHTML=`<p class="muted">Nothing pending. </p>`; return; }
    const bySite={}; rows.forEach(t=>{ (bySite[t.site_id||"none"]=bySite[t.site_id||"none"]||[]).push(t); });
    const todayStr=today();
    $("tdList").innerHTML=Object.keys(bySite).map(k=>{
      const list=bySite[k], open=list.filter(t=>t.status==="open").length;
      return `<div class="card" style="margin-bottom:14px">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px">
          ${k!=="none"&&siteCode(k)?`<span class="code">${esc(siteCode(k))}</span>`:""}
          <h3 style="font-size:17px">${k==="none"?"Not linked to a project":esc(siteName(k))}</h3>
          <span class="muted" style="font-size:13px">${open} open</span>
        </div>
        ${list.map(t=>{
          const late = t.status==="open" && t.due_date && t.due_date<todayStr;
          return `<div class="todo ${t.status==="done"?"done":""}">
            <input type="checkbox" data-tdk="${t.id}" ${t.status==="done"?"checked":""}>
            <div style="flex:1">
              <div class="tt">${esc(t.title)}</div>
              ${t.detail?`<div class="td-meta">${esc(t.detail)}</div>`:""}
              <div class="td-meta">
                ${t.due_date?`<span style="${late?"color:var(--red);font-weight:600":""}">${late?"OVERDUE · ":""}${fmtD(t.due_date)}</span> · `:""}
                ${t.assigned_to?esc(profName(t.assigned_to))+" · ":""}
                ${t.priority!=="normal"?`<span class="pill ${t.priority}">${t.priority==="high"?"Urgent":"Low"}</span>`:""}
              </div>
            </div>
            ${ME.role==="admin"?`<button class="btn danger sm" data-tdd="${t.id}">×</button>`:""}
          </div>`;
        }).join("")}
      </div>`;
    }).join("");

    $("tdList").querySelectorAll("[data-tdk]").forEach(cb=>cb.onchange=async()=>{
      const done=cb.checked;
      await sb.from("todos").update({status:done?"done":"open",done_at:done?new Date().toISOString():null}).eq("id",cb.dataset.tdk);
      render();
    });
    $("tdList").querySelectorAll("[data-tdd]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Delete this item?"))return;
      await sb.from("todos").delete().eq("id",b.dataset.tdd); render();
    });
  }
  await render();
}

/* ================= SUPERVISOR: MY REPORTS ================= */
async function vMine(){
  const {data}=await sb.from("daily_reports").select("*").eq("supervisor_id",ME.id).order("report_date",{ascending:false}).limit(60);
  const reps=data||[];
  const rej=reps.filter(r=>r.status==="rejected");
  $("main").innerHTML=`<h2 style="font-size:20px;margin-bottom:12px">My recent reports</h2>
    ${rej.length?`<div class="msg err">${rej.length} report(s) were sent back by the office. Open them below, fix the entry and save — they go back for review automatically.</div>`:""}
    <div id="mList">${reps.map(r=>repCard(r,false)).join("")||`<p class="muted">No reports yet — submit your first daily report.</p>`}</div>`;
  wireRepActions($("mList"),()=>openTab("mine"),reps);
}
