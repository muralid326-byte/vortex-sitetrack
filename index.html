<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --panel2:#F5F7FA; --line:#E2E6EC;
  --text:#1C2431; --muted:#6A7482; --red2:#D71920; --navy:#1C2431; --amber:#D71920;
  --green:#1E8E4D; --red:#C7402D; --blue:#2563C4;
  --radius:10px; --shadow:0 1px 3px rgba(22,53,94,.08);
  --display:'Saira Condensed',sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
label{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 5px;font-weight:500}
h1,h2,h3{font-family:var(--display);letter-spacing:.03em;text-transform:uppercase;color:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.btn{background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:14px}
.btn:hover{filter:brightness(1.15)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.sec:hover{border-color:var(--navy)}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.msg{padding:10px 14px;border-radius:8px;font-size:14px;margin:12px 0}
.msg.err{background:#FBEDEA;color:#96301F;border:1px solid #EFC5BC}
.msg.ok{background:#EAF6EE;color:#166237;border:1px solid #BFE3CC}
header{border-bottom:3px solid var(--amber);background:#fff;position:sticky;top:0;z-index:20;box-shadow:var(--shadow)}
.hbar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:38px;width:auto;display:block}
.logo .fallback{font-family:var(--display);font-size:22px;letter-spacing:.05em;color:var(--navy);font-weight:700}
.logo .fallback span{color:var(--amber)}
.logo .app{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;text-transform:uppercase}
.rolebadge{font-family:var(--mono);font-size:11px;letter-spacing:.1em;border:1px solid var(--line);border-radius:99px;padding:2px 10px;color:var(--muted);text-transform:uppercase}
.hbar .spacer{flex:1}
.uname{font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;max-width:1180px;margin:14px auto 20px;padding:0 16px;flex-wrap:wrap}
nav.tabs button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:500}
nav.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#fff 0%,#F1F4F9 100%)}
.login-card{width:100%;max-width:400px}
.login-card .hazard{height:8px;border-radius:4px 4px 0 0;background:repeating-linear-gradient(45deg,var(--amber) 0 14px,var(--navy) 14px 28px)}
.login-card .inner{background:#fff;border:1px solid var(--line);border-top:none;border-radius:0 0 var(--radius) var(--radius);padding:28px;box-shadow:var(--shadow)}
.login-card .logo{justify-content:center;margin-bottom:8px}
.login-card .sub{font-size:13px;color:var(--muted);margin-bottom:22px;text-align:center}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1.1;color:var(--navy)}
.stat .l{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 10px;border-bottom:1px solid #EDF0F4;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl .num{font-family:var(--mono);text-align:right}
.tbl tfoot td{border-top:2px solid var(--line);font-weight:600;background:var(--panel2)}
.tblwrap{overflow-x:auto}
.pill{font-family:var(--mono);font-size:11px;border-radius:99px;padding:2px 9px;letter-spacing:.05em}
.pill.ongoing{background:#E4EDFB;color:#1D4E9E}
.pill.completed{background:#E4F5EA;color:#166237}
.pill.on-hold{background:#FBF1DC;color:#8A6210}
.pill.inactive{background:#F8E7E4;color:#96301F}
.pill.hol{background:#FBF1DC;color:#8A6210}
.rowset{display:grid;gap:8px}
.rowline{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr 1fr auto;align-items:center}
.rowline.r3{grid-template-columns:2fr 1fr 1fr auto}
.rowline .x{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:36px;height:38px;font-size:16px}
.rowline .x:hover{color:var(--red);border-color:var(--red)}
.addrow{background:#fff;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:8px;font-size:13px;width:100%}
.addrow:hover{color:var(--navy);border-color:var(--navy)}
fieldset{border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:16px;background:#fff}
legend{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);padding:0 8px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.sitecard{border-left:4px solid var(--navy)}
.sitecard h3{font-size:19px}
.kv{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.kv div b{font-family:var(--mono);font-size:19px;display:block;color:var(--navy)}
.kv div span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.note{background:var(--panel2);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px;border-left:3px solid var(--amber)}
details.rep{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;box-shadow:var(--shadow)}
details.rep summary{padding:10px 14px;cursor:pointer;display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:14px;list-style:none}
details.rep summary::-webkit-details-marker{display:none}
details.rep .body{padding:0 14px 14px;font-size:14px}
.flexbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.flexbar>div{min-width:130px}
.pl-line{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #EDF0F4;font-size:14px}
.pl-line b{font-family:var(--mono)}
.pl-line.total{border-top:2px solid var(--line);border-bottom:none;font-weight:600;font-size:16px}
.profit-pos{color:var(--green)} .profit-neg{color:var(--red)}
.checkline{display:flex;align-items:center;gap:8px;font-size:14px}
.checkline input{width:auto}
.pill.submitted{background:#E4EDFB;color:#1D4E9E}
.pill.approved{background:#E4F5EA;color:#166237}
.pill.rejected{background:#F8E7E4;color:#96301F}
.pill.pending{background:#FBF1DC;color:#8A6210}
.offbar{position:fixed;left:0;right:0;bottom:0;background:#8A6210;color:#fff;font-size:13px;padding:9px 14px;text-align:center;z-index:60;font-weight:500}
.offbar.sync{background:#1E8E4D}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-top:10px}
.photos .thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.photos img{width:100%;height:92px;object-fit:cover;display:block}
.photos .thumb button{position:absolute;top:4px;right:4px;background:rgba(28,36,49,.72);color:#fff;border:none;border-radius:6px;width:24px;height:24px;font-size:14px;line-height:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:fit-content;margin-bottom:12px}
.seg button{background:#fff;border:none;padding:8px 16px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff;font-weight:600}
.rowline.wk{grid-template-columns:2.2fr 1fr 1fr auto}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.revbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.filedrop{border:1px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.filedrop input{display:none}
@media(max-width:680px){
  .rowline.wk{grid-template-columns:1.7fr .8fr .8fr auto}
  .f2,.f3{grid-template-columns:1fr}
  .rowline{grid-template-columns:1.6fr .8fr .8fr .8fr auto}
  .rowline.r3{grid-template-columns:1.6fr 1fr 1fr auto}
  .stat .v{font-size:22px}
}
</style>
</head>

/* ---------- shared data ---------- */
async function loadBase(){
  const [s,w,t,st,wk] = await Promise.all([
    sb.from("sites").select("*").order("name"),
    sb.from("work_items").select("*").order("name"),
    sb.from("trades").select("*").order("sort"),
    sb.from("settings").select("*").eq("id",1).single(),
    sb.from("workers").select("*").order("name")
  ]);
  SITES=s.data||[]; WORKS=w.data||[]; TRADES=t.data||[]; WORKERS=wk.data||[];
  if(st.data) SET=st.data;
  if(ME.role==="admin"){ const p=await sb.from("profiles").select("*").order("full_name"); PROFILES=p.data||[]; }
}
const siteName = id => (SITES.find(s=>s.id===id)||{}).name||"—";
const workName = id => (WORKS.find(w=>w.id===id)||{}).name||"General";
const profName = id => (PROFILES.find(p=>p.id===id)||{}).full_name||"";
const tradeRate = name => { const t=TRADES.find(x=>x.name===name); return t?+t.rate:0; };
const workerById = id => WORKERS.find(w=>w.id===id);
/* a named worker may carry his own hourly rate; 0 / blank falls back to the trade rate */
function mpRate(m){
  if(m.worker_id){ const w=workerById(m.worker_id); if(w && +w.rate>0) return +w.rate; if(w && !m.trade) return tradeRate(w.trade); }
  return tradeRate(m.trade);
}

/* labour cost of one report using rates + OT/holiday rules */
function repCalc(r){
  let men=0, normH=0, otH=0, cost=0;
  const holM=+SET.holiday_multiplier, otM=+SET.ot_multiplier;
  (r.manpower||[]).forEach(m=>{
    const c=+m.count||0, nh=+(m.norm_hours??m.hours)||0, oh=+m.ot_hours||0, rate=mpRate(m);
    men+=c; normH+=c*nh; otH+=c*oh;
    const dayM = r.is_holiday? holM : 1;
    const otEff = r.is_holiday? holM : otM;
    cost += c*rate*(nh*dayM + oh*otEff);
  });
  return {men, normH, otH, hrs:normH+otH, cost};
}
async function fetchReports(from,to,siteId,opts){
  opts=opts||{};
  let q=sb.from("daily_reports").select("*").order("report_date",{ascending:false});
  if(from) q=q.gte("report_date",from); if(to) q=q.lte("report_date",to);
  if(siteId) q=q.eq("site_id",siteId);
  if(opts.status) q=q.eq("status",opts.status);
  const {data,error}=await q;
  let rows = error?[]:(data||[]);
  /* rejected reports never count towards hours or cost */
  if(opts.costable) rows = rows.filter(r=>(r.status||"submitted")!=="rejected");
  if(opts.approvedOnly) rows = rows.filter(r=>r.status==="approved");
  return rows;
}
function rangeDefaults(){ const t=new Date(); const f=new Date(t); f.setDate(t.getDate()-6); return [f.toLocaleDateString("en-CA"), today()]; }

}

async function vDash(){
  const [dF,dT]=rangeDefaults();
  $("main").innerHTML=`
    <div class="flexbar">
      <div><label>From</label><input type="date" id="dFrom" value="${dF}"></div>
      <div><label>To</label><input type="date" id="dTo" value="${dT}"></div>
      <button class="btn sm" id="dGo">Apply</button>
      <button class="btn sec sm" id="dCsv">Export CSV</button>
    </div>
    <div class="board" id="dBoard"></div>
    <h2 style="font-size:20px;margin:6px 0 12px">By project</h2>
    <div class="grid" id="dSites"></div>`;
  $("dGo").onclick=render; $("dCsv").onclick=()=>exportCsv($("dFrom").value,$("dTo").value);
  await render();
  async function render(){
    const reps=await fetchReports($("dFrom").value,$("dTo").value,null,{costable:true});
    let tNorm=0,tOt=0,tCost=0; const by={};
    const menToday=reps.filter(r=>r.report_date===today()).reduce((a,r)=>a+repCalc(r).men,0);
    reps.forEach(r=>{
      const c=repCalc(r); tNorm+=c.normH; tOt+=c.otH; tCost+=c.cost;
      const b=(by[r.site_id]=by[r.site_id]||{normH:0,otH:0,cost:0,reps:[],mats:{},last:null});
      b.normH+=c.normH; b.otH+=c.otH; b.cost+=c.cost; b.reps.push(r);
      if(!b.last||r.report_date>b.last) b.last=r.report_date;
      (r.materials||[]).forEach(m=>{const k=`${m.name} (${m.unit||"nos"})`; b.mats[k]=(b.mats[k]||0)+(+m.qty||0);});
    });
    $("dBoard").innerHTML =
      stat(menToday,"Men on site today")+stat(n1(tNorm+tOt),"Man-hours in range")+
      stat(n1(tOt),"OT hours")+stat(reps.length,"Reports filed")+
      (ME.role==="admin"?stat(money(tCost),"Labour cost (range)"):"");
    $("dSites").innerHTML = SITES.filter(s=>s.active||by[s.id]).map(s=>{
      const d=by[s.id];
      if(!d) return `<div class="card sitecard"><h3>${esc(s.name)}</h3><div class="muted" style="font-size:13px">${esc(s.client_name||"")}</div><p class="muted" style="margin-top:8px">No reports in this range.</p></div>`;
      const latest=d.reps.find(r=>(r.progress_note||"").trim());
      const mats=Object.entries(d.mats).slice(0,6).map(([k,v])=>`${esc(k)}: <span class="mono">${n1(v)}</span>`).join(" · ");
      return `<div class="card sitecard">
        <h3>${esc(s.name)}</h3><div class="muted" style="font-size:13px">${esc(s.client_name||"")} · last report ${fmtD(d.last)}</div>
        <div class="kv">
          <div><b>${n1(d.normH+d.otH)}</b><span>man-hours</span></div>
          <div><b>${n1(d.otH)}</b><span>OT hours</span></div>
          <div><b>${d.reps.length}</b><span>reports</span></div>
          ${ME.role==="admin"?`<div><b>${money(d.cost)}</b><span>labour cost</span></div>`:""}
        </div>
        ${mats?`<div class="note" style="border-left-color:var(--blue)"><b style="font-size:11px;letter-spacing:.06em">MATERIALS</b><br>${mats}</div>`:""}
        ${latest?`<div class="note"><b style="font-size:11px;letter-spacing:.06em">LATEST PROGRESS · ${fmtD(latest.report_date)}</b><br>${esc(latest.progress_note)}</div>`:""}
      </div>`;
    }).join("") || `<p class="muted">No projects yet.</p>`;
  }
  function stat(v,l){ return `<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`; }
}
async function exportCsv(from,to){
  const reps=await fetchReports(from,to,null,{costable:true});
  const rows=[["Date","Day type","Status","Site","Work","Supervisor","Worker name","Trade","Men","Norm hrs each","OT hrs each","Man-hrs","Labour cost","Materials","Equipment","Progress note"]];
  reps.forEach(r=>{
    const mats=(r.materials||[]).map(m=>`${m.name} ${m.qty}${m.unit||""}`).join("; ");
    const eqp=(r.equipment||[]).map(e=>`${e.name} x${e.qty}${e.hours?` (${e.hours}h)`:""}`).join("; ");
    const mp=(r.manpower&&r.manpower.length)?r.manpower:[{}];
    mp.forEach((m,i)=>{
      const c=+m.count||0, nh=+(m.norm_hours??m.hours)||0, oh=+m.ot_hours||0, rate=mpRate(m);
      const dayM=r.is_holiday?+SET.holiday_multiplier:1, otEff=r.is_holiday?+SET.holiday_multiplier:+SET.ot_multiplier;
      rows.push([r.report_date, r.is_holiday?"Holiday/Sun":"Normal", r.status||"submitted", siteName(r.site_id), workName(r.work_item_id), profName(r.supervisor_id),
        m.worker_name||"", m.trade||"", c||"", nh||"", oh||"", c*(nh+oh)||"", (c*rate*(nh*dayM+oh*otEff)).toFixed(2),
        i?"":mats, i?"":eqp, i?"":(r.progress_note||"").replace(/\n/g," ")]);
    });
  });
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download=`sitetrack_${from}_to_${to}.csv`; a.click();
}

function repCard(r,adminView){

  return `<details class="rep"><summary>

    </summary><div class="body">

      ${r.review_note?`<div class="note" style="border-left-color:${st==="rejected"?"var(--red)":"var(--green)"}"><b style="font-size:11px;letter-spacing:.06em">REVIEW NOTE</b><br>${esc(r.review_note)}</div>`:""}
      ${(r.reviewed_at&&adminView)?`<p class="hint">${stLbl.toLowerCase()} by ${esc(profName(r.reviewed_by)||"admin")} on ${fmtD(String(r.reviewed_at).slice(0,10))}</p>`:""}
      <div class="revbar">
        ${(ME.role==="admin")?`
          ${st!=="approved"?`<button class="btn sm" data-appr="${r.id}">Approve</button>`:""}
          ${st!=="rejected"?`<button class="btn sec sm" data-rej="${r.id}">Reject…</button>`:""}
          <button class="btn sec sm" data-edit="${r.id}">Edit</button>

        :`${st!=="approved"?`<button class="btn sec sm" data-edit="${r.id}">Edit report</button>`:`<span class="muted" style="font-size:13px">Approved — locked for editing.</span>`}
          ${st==="submitted"?`<button class="btn danger sm" data-del="${r.id}">Delete</button>`:""}`}

/* wires approve / reject / edit / delete + loads signed photo URLs */
function wireRepActions(root,refresh,reps){
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Delete this report? This cannot be undone."))return;
    const r=(reps||[]).find(x=>x.id===b.dataset.del);
    const paths=((r&&r.photos)||[]).map(p=>p.path).filter(Boolean);
    if(paths.length) await sb.storage.from(PHOTO_BUCKET).remove(paths);
    await sb.from("daily_reports").delete().eq("id",b.dataset.del); refresh();
  });
  root.querySelectorAll("[data-appr]").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    const {error}=await sb.from("daily_reports").update({status:"approved",reviewed_by:ME.id,reviewed_at:new Date().toISOString(),review_note:null}).eq("id",b.dataset.appr);
    if(error) alert(error.message); refresh();
  });
  root.querySelectorAll("[data-rej]").forEach(b=>b.onclick=async()=>{
    const note=prompt("Reason for rejection (the supervisor will see this and can correct the report):");
    if(note===null) return;
    b.disabled=true;
    const {error}=await sb.from("daily_reports").update({status:"rejected",reviewed_by:ME.id,reviewed_at:new Date().toISOString(),review_note:note}).eq("id",b.dataset.rej);
    if(error) alert(error.message); refresh();
  });
  root.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const r=(reps||[]).find(x=>x.id===b.dataset.edit);
    if(r) openTab("entry",r);
  });
  hydratePhotos(root,reps);
}
async function hydratePhotos(root,reps){
  const boxes=[...root.querySelectorAll("[data-ph]")]; if(!boxes.length) return;
  const paths=[]; boxes.forEach(bx=>{
    const r=(reps||[]).find(x=>x.id===bx.dataset.ph);
    ((r&&r.photos)||[]).forEach(p=>p.path&&paths.push(p.path));
  });
  if(!paths.length) return;
  const {data,error}=await sb.storage.from(PHOTO_BUCKET).createSignedUrls(paths,3600);
  const map={}; if(!error)(data||[]).forEach(d=>{ if(d.signedUrl) map[d.path]=d.signedUrl; });
  boxes.forEach(bx=>{
    const r=(reps||[]).find(x=>x.id===bx.dataset.ph);
    bx.innerHTML=((r&&r.photos)||[]).map(p=>map[p.path]
      ?`<div class="thumb"><a href="${map[p.path]}" target="_blank" rel="noopener"><img loading="lazy" src="${map[p.path]}" alt="${esc(p.name||"site photo")}"></a></div>`
      :`<div class="thumb muted" style="padding:10px;font-size:11px">unavailable</div>`).join("");
  });
}

async function vImport(){
  $("main").innerHTML=`
    <div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:10px">1 — Download standard template</h2>
        <p style="font-size:14px;margin-bottom:12px">Excel template for past manpower allocation. One row per trade per day. Fill it (or copy from your existing sheets) and upload it on the right — projects, works and reports are created automatically and flow straight into man-hours and P&amp;L.</p>
        <button class="btn" id="xTpl">Download template (.xlsx)</button>
        <div class="note" style="margin-top:14px"><b style="font-size:11px;letter-spacing:.06em">TEMPLATE COLUMNS</b><br>
        Date (DD/MM/YYYY) · Project · Work (optional) · Trade · Men · Normal Hours · OT Hours · Holiday (Y/N) · Remarks</div>
      </div>
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:10px">2 — Upload filled template</h2>
        <input type="file" id="xFile" accept=".xlsx,.xls,.csv" style="margin-bottom:12px">
        <button class="btn" id="xGo">Import</button>
        <div id="xMsg"></div>
      </div>
    </div>`;

  $("xTpl").onclick=()=>{
    const hdr=["Date","Project","Work","Trade","Men","Normal Hours","OT Hours","Holiday (Y/N)","Remarks"];
    const eg=[["01/07/2026","PCS Ayer Merbau","Flare Shelter","General Worker",6,8,2,"N","Blasting & priming"],
              ["01/07/2026","PCS Ayer Merbau","Flare Shelter","Welder",2,8,0,"N",""],
              ["05/07/2026","Sembcorp Cogen","","Fitter",4,8,4,"Y","Sunday shutdown work"]];
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet([hdr,...eg]);
    ws["!cols"]=hdr.map((h,i)=>({wch:[12,24,22,22,6,13,9,13,30][i]}));
    XLSX.utils.book_append_sheet(wb,ws,"Manpower");
    const tw=XLSX.utils.aoa_to_sheet([["Valid trades (exact spelling)"],...TRADES.filter(t=>t.active).map(t=>[t.name])]);
    tw["!cols"]=[{wch:28}];
    XLSX.utils.book_append_sheet(wb,tw,"Trades");
    XLSX.writeFile(wb,"SiteTrack_Manpower_Template.xlsx");
  };

  function parseDate(v){
    if(v==null||v==="") return null;
    if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); if(!d)return null;
      return `${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`; }
    const s=String(v).trim();
    let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
    m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if(m){ let y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
    return null;
  }

  $("xGo").onclick=async()=>{
    const f=$("xFile").files[0];
    if(!f){ $("xMsg").innerHTML=`<div class="msg err">Choose the filled template file first.</div>`; return; }
    $("xMsg").innerHTML=`<div class="msg ok">Reading file…</div>`;
    try{
      const wb=XLSX.read(await f.arrayBuffer());
      const ws=wb.Sheets["Manpower"]||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:""});
      if(!rows.length) throw new Error("No data rows found.");
      const errs=[]; const parsed=[];
      rows.forEach((r,i)=>{
        const get=k=>{ const key=Object.keys(r).find(x=>x.toLowerCase().trim().startsWith(k)); return key?r[key]:""; };
        const date=parseDate(get("date")); const proj=String(get("project")).trim();
        const trade=String(get("trade")).trim(); const men=+get("men")||0;
        if(!date||!proj||!trade||!men){ if(String(get("project"))||String(get("trade"))) errs.push(`Row ${i+2}: needs Date, Project, Trade and Men`); return; }
        parsed.push({date,proj,work:String(get("work")).trim(),trade,men,
          nh:+get("normal")||+SET.std_hours, oh:+get("ot")||0,
          hol:/^y/i.test(String(get("holiday")).trim()), rem:String(get("remarks")).trim()});
      });
      if(!parsed.length) throw new Error("No valid rows. "+(errs[0]||""));
      // ensure projects
      const projNames=[...new Set(parsed.map(p=>p.proj))];
      for(const pn of projNames){
        if(!SITES.find(s=>s.name.toLowerCase()===pn.toLowerCase())){
          const {data,error}=await sb.from("sites").insert({name:pn}).select().single();
          if(error) throw error; SITES.push(data);
        }
      }
      // ensure works
      for(const p of parsed){
        if(!p.work) continue;
        const site=SITES.find(s=>s.name.toLowerCase()===p.proj.toLowerCase());
        if(!WORKS.find(w=>w.site_id===site.id&&w.name.toLowerCase()===p.work.toLowerCase())){
          const {data,error}=await sb.from("work_items").insert({site_id:site.id,name:p.work}).select().single();
          if(error) throw error; WORKS.push(data);
        }
      }
      // ensure trades
      const tNames=[...new Set(parsed.map(p=>p.trade))];
      for(const tn of tNames){
        if(!TRADES.find(t=>t.name.toLowerCase()===tn.toLowerCase())){
          const {data,error}=await sb.from("trades").insert({name:tn}).select().single();
          if(error) throw error; TRADES.push(data);
        }
      }
      // group into reports: date + project + work + holiday
      const groups={};
      parsed.forEach(p=>{
        const site=SITES.find(s=>s.name.toLowerCase()===p.proj.toLowerCase());
        const work=p.work?WORKS.find(w=>w.site_id===site.id&&w.name.toLowerCase()===p.work.toLowerCase()):null;
        const trade=TRADES.find(t=>t.name.toLowerCase()===p.trade.toLowerCase());
        const key=[p.date,site.id,work?work.id:"",p.hol].join("|");
        (groups[key]=groups[key]||{report_date:p.date,site_id:site.id,work_item_id:work?work.id:null,
          supervisor_id:ME.id,is_holiday:p.hol,status:"approved",reviewed_by:ME.id,reviewed_at:new Date().toISOString(),
          manpower:[],materials:[],equipment:[],progress_note:""}).manpower
          .push({trade:trade.name,count:p.men,norm_hours:p.nh,ot_hours:p.oh});
        if(p.rem){ const g=groups[key]; g.progress_note=g.progress_note?g.progress_note+"; "+p.rem:p.rem; }
      });
      const payloads=Object.values(groups);
      for(let i=0;i<payloads.length;i+=50){
        const {error}=await sb.from("daily_reports").insert(payloads.slice(i,i+50));
        if(error) throw error;
      }
      $("xMsg").innerHTML=`<div class="msg ok">Imported ${parsed.length} manpower rows → ${payloads.length} daily reports across ${projNames.length} project(s).${errs.length?" Skipped: "+errs.length+" row(s).":""} Man-hours and labour cost are now live in the Dashboard and P&L.</div>`;
      loadBase();
    }catch(e){ $("xMsg").innerHTML=`<div class="msg err">${esc(e.message||e)}</div>`; }
  };
}

/* ---------- photo helpers ---------- */
async function shrink(file,max,q){
  max=max||1400; q=q||0.68;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const sc=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement("canvas");
    cv.width=Math.max(1,Math.round(img.width*sc)); cv.height=Math.max(1,Math.round(img.height*sc));
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    return await new Promise(res=>cv.toBlob(res,"image/jpeg",q));
  }catch(e){ return file; }
  finally{ URL.revokeObjectURL(url); }
}
const b2d = blob => new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(blob); });
function d2b(dataUrl){
  const [head,body]=dataUrl.split(","); const mime=(head.match(/:(.*?);/)||[])[1]||"image/jpeg";
  const bin=atob(body); const u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime});
}
const rndName = () => (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2))+".jpg";

/* ---------- offline queue ---------- */
function qGet(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)||"[]"); }catch(e){ return []; } }
function qSet(v){ try{ localStorage.setItem(QUEUE_KEY,JSON.stringify(v)); }catch(e){} }
function netBar(msg,cls){
  let b=$("offBar");
  if(!b){ b=document.createElement("div"); b.id="offBar"; document.body.appendChild(b); }
  if(!msg){ b.style.display="none"; return; }
  b.className="offbar"+(cls?" "+cls:""); b.textContent=msg; b.style.display="block";
}
function netStatus(){
  const q=qGet().length;
  if(!navigator.onLine) netBar(`Offline — reports are saved on this device and sent automatically when signal returns.${q?` (${q} waiting)`:""}`);
  else if(q) netBar(`${q} report(s) waiting to sync…`);
  else netBar("");
}
async function queueReport(payload,photos){
  const ph=[]; let bytes=0, skipped=0;
  for(const p of photos){
    const d=await b2d(p.blob);
    if(bytes+d.length>2600000 || ph.length>=4){ skipped++; continue; }
    bytes+=d.length; ph.push({name:p.name,data:d});
  }
  const q=qGet(); q.push({payload,photos:ph,at:Date.now()}); qSet(q); netStatus();
  return skipped;
}
async function flushQueue(){
  if(!ME||!navigator.onLine) return 0;
  let q=qGet(); if(!q.length) return 0;
  netBar(`Syncing ${q.length} saved report(s)…`,"sync");
  const left=[]; let done=0;
  for(const item of q){
    try{
      const photos=(item.photos||[]).map(p=>({name:p.name,blob:d2b(p.data)}));
      const {error}=await pushReport(item.payload,photos,[],null);
      if(error) throw error;
      done++;
    }catch(e){ left.push(item); }
  }
  qSet(left);
  netBar(done?`${done} report(s) synced.`:"","sync");
  setTimeout(netStatus,2500);
  return done;
}
/* single write path used by the form and by the queue */
async function pushReport(payload,newPhotos,keep,editId){
  const uploaded=[];
  for(const p of (newPhotos||[])){
    const path=`${payload.site_id}/${payload.report_date}/${rndName()}`;
    const {error}=await sb.storage.from(PHOTO_BUCKET).upload(path,p.blob,{contentType:"image/jpeg"});
    if(error) return {error};
    uploaded.push({path,name:p.name});
  }
  const body=Object.assign({},payload,{photos:(keep||[]).concat(uploaded)});
  return editId ? await sb.from("daily_reports").update(body).eq("id",editId)
                : await sb.from("daily_reports").insert(body);
}

async function vEntry(rec){
  const editing = (rec&&rec.id)?rec:null;
  $("main").dataset.editing = editing?"1":"0";
  PHOTOS=[]; KEEP = editing?((editing.photos||[]).slice()):[];
  let draft=null;
  if(!editing){ try{ const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||"null"); if(d&&d.uid===ME.id) draft=d; }catch(e){} }
  const src = editing || draft;
  MPMODE = (src && (src.mode==="worker" || (src.manpower||[]).some(m=>m.worker_id))) ? "worker" : "trade";
  if(MPMODE==="worker" && !WORKERS.length) MPMODE="trade";

  const activeSites=SITES.filter(s=>s.active||(editing&&s.id===editing.site_id));
  const mpRows=(src&&(src.manpower||[]).length)
    ? (src.manpower||[]).map(m=>MPMODE==="worker"?wkRow(m):mpRow(m)).join("")
    : (MPMODE==="worker"?wkRow():mpRow());

  $("main").innerHTML=`
    <div class="card" style="max-width:820px;margin:0 auto">
      <h2 style="font-size:20px;margin-bottom:6px">${editing?"Edit daily site report":"Daily site report"}</h2>
      ${editing?`<p class="hint" style="margin-bottom:12px">${fmtD(editing.report_date)} · ${esc(siteName(editing.site_id))}${editing.status==="rejected"?` — sent back by the office${editing.review_note?`: “${esc(editing.review_note)}”`:""}. Saving puts it back for review.`:""}</p>`:""}
      ${draft?`<div class="msg ok" id="dMsgBar">Unsaved draft restored. <button class="btn sec sm" id="dDiscard" style="margin-left:8px">Start fresh</button></div>`:""}
      <div class="f3" style="margin-bottom:10px">
        <div><label>Date</label><input type="date" id="eDate" value="${(src&&src.report_date)||today()}"></div>
        <div><label>Project</label><select id="eSite">${activeSites.map(s=>`<option value="${s.id}" ${src&&src.site_id===s.id?"selected":""}>${esc(s.name)}</option>`).join("")}</select></div>
        <div><label>Work</label><select id="eWork"></select></div>
      </div>
      <div class="checkline" style="margin-bottom:16px">
        <input type="checkbox" id="eHol" ${src&&src.is_holiday?"checked":""}><label for="eHol" style="margin:0;text-transform:none;font-size:14px;color:var(--text)">Sunday / Public holiday (holiday rate ×${SET.holiday_multiplier})</label>
      </div>
      <fieldset data-kind="mp"><legend>Manpower — standard day ${SET.std_hours} hrs, OT ×${SET.ot_multiplier}</legend>
        <div class="seg" id="mpSeg">
          <button type="button" data-m="trade" class="${MPMODE==="trade"?"on":""}">By trade (count)</button>
          <button type="button" data-m="worker" class="${MPMODE==="worker"?"on":""}">By worker name</button>
        </div>
        <div class="rowset">${mpRows}</div>
        <button type="button" class="addrow" style="margin-top:8px">+ Add ${MPMODE==="worker"?"worker":"trade"}</button>
        ${MPMODE==="worker"?`<button type="button" class="addrow" id="mpAll" style="margin-top:6px">+ Add all workers posted to this project</button>
          ${WORKERS.length?"":`<p class="hint">No workers in the register yet — add them under the Workers tab.</p>`}`:""}
      </fieldset>
      <fieldset data-kind="mat"><legend>Materials used / received</legend>
        <div class="rowset">${((src&&src.materials)||[]).map(m=>simpleRow("mat",m)).join("")}</div>
        <button type="button" class="addrow" style="margin-top:8px">+ Add material</button></fieldset>
      <fieldset data-kind="eq"><legend>Equipment</legend>
        <div class="rowset">${((src&&src.equipment)||[]).map(m=>simpleRow("eq",m)).join("")}</div>
        <button type="button" class="addrow" style="margin-top:8px">+ Add equipment</button></fieldset>
      <fieldset><legend>Site photos</legend>
        <label class="filedrop" for="ePhoto">Tap to add photos — camera or gallery<input id="ePhoto" type="file" accept="image/*" multiple></label>
        <div class="photos" id="ePhotos"></div>
        <p class="hint">Photos are resized to about 1400 px before upload so they are quick to send on site data.</p>
      </fieldset>
      <div style="margin-bottom:16px"><label>Progress / remarks</label>
        <textarea id="eNote" rows="3" placeholder="Work done today, delays, safety observations…">${esc((src&&src.progress_note)||"")}</textarea></div>
      <button class="btn" id="eSave" style="width:100%">${editing?"Save changes":"Submit report"}</button>
      ${editing?`<button class="btn sec" id="eCancel" style="width:100%;margin-top:8px">Cancel</button>`:""}
      <div id="eMsg"></div>
    </div>`;

  const fillWorks=()=>{
    const ws=WORKS.filter(w=>w.site_id===$("eSite").value&&w.status!=="completed");
    $("eWork").innerHTML=`<option value="">General</option>`+ws.map(w=>`<option value="${w.id}" ${src&&src.work_item_id===w.id?"selected":""}>${esc(w.name)}</option>`).join("");
  };
  $("eSite").onchange=()=>{ fillWorks(); saveDraft(); };
  if(activeSites.length) fillWorks();
  const autoHol=()=>{ const d=new Date($("eDate").value+"T00:00:00"); if(d.getDay()===0) $("eHol").checked=true; };
  $("eDate").onchange=()=>{ autoHol(); saveDraft(); };
  if(!src) autoHol();
  $("main").querySelectorAll("fieldset").forEach(wireRowset);
  $("main").addEventListener("input",saveDraft);
  if($("dDiscard")) $("dDiscard").onclick=()=>{ clearDraft(); openTab("entry"); };
  if($("eCancel")) $("eCancel").onclick=()=>openTab(ME.role==="admin"?"reports":"mine");

  /* manpower mode switch — keeps hours, drops rows that cannot be mapped */
  $("mpSeg").querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
    if(btn.dataset.m===MPMODE) return;
    if(btn.dataset.m==="worker" && !WORKERS.length){ alert("Add workers to the register first (Workers tab)."); return; }
    const cur=collectForm();
    MPMODE=btn.dataset.m;
    const keepRows = MPMODE==="worker" ? "" : (cur.manpower||[]).map(m=>mpRow({trade:m.trade,count:m.count||1,norm_hours:m.norm_hours,ot_hours:m.ot_hours})).join("");
    const fs=$("main").querySelector('fieldset[data-kind="mp"]');
    fs.querySelector(".rowset").innerHTML = keepRows || (MPMODE==="worker"?wkRow():mpRow());
    fs.querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x.dataset.m===MPMODE));
    const addBtns=fs.querySelectorAll(".addrow");
    addBtns[0].textContent = "+ Add "+(MPMODE==="worker"?"worker":"trade");
    wireRowset(fs); wireAllBtn(); saveDraft();
  });
  function wireAllBtn(){
    const all=$("mpAll"); if(!all) return;
    all.onclick=()=>{
      const sid=$("eSite").value;
      const mine=WORKERS.filter(w=>w.active&&w.site_id===sid);
      if(!mine.length) return alert("No workers are posted to this project yet. Set their project under the Workers tab.");
      const have=new Set([...$("main").querySelectorAll('[data-kind="wk"] .c1')].map(x=>x.value));
      const fs=$("main").querySelector('fieldset[data-kind="mp"]');
      mine.filter(w=>!have.has(w.id)).forEach(w=>fs.querySelector(".rowset").insertAdjacentHTML("beforeend",wkRow({worker_id:w.id})));
      [...fs.querySelectorAll('[data-kind="wk"] .c1')].forEach((selEl,i)=>{ /* keep selections */ });
      wireX(fs); saveDraft();
    };
  }
  wireAllBtn();

  /* photos */
  async function renderPhotos(){
    let signed={};
    if(KEEP.length){
      const {data}=await sb.storage.from(PHOTO_BUCKET).createSignedUrls(KEEP.map(k=>k.path),3600);
      (data||[]).forEach(d=>{ if(d.signedUrl) signed[d.path]=d.signedUrl; });
    }
    $("ePhotos").innerHTML =
      KEEP.map((k,i)=>`<div class="thumb"><img src="${signed[k.path]||""}" alt=""><button type="button" data-rmk="${i}">×</button></div>`).join("")+
      PHOTOS.map((p,i)=>`<div class="thumb"><img src="${p.url}" alt=""><button type="button" data-rmp="${i}">×</button></div>`).join("");
    $("ePhotos").querySelectorAll("[data-rmk]").forEach(b=>b.onclick=()=>{ KEEP.splice(+b.dataset.rmk,1); renderPhotos(); });
    $("ePhotos").querySelectorAll("[data-rmp]").forEach(b=>b.onclick=()=>{ URL.revokeObjectURL(PHOTOS[+b.dataset.rmp].url); PHOTOS.splice(+b.dataset.rmp,1); renderPhotos(); });
  }
  $("ePhoto").onchange=async e=>{
    const files=[...e.target.files]; e.target.value="";
    for(const f of files){
      if(KEEP.length+PHOTOS.length>=10){ alert("Maximum 10 photos per report."); break; }
      const blob=await shrink(f);
      PHOTOS.push({name:f.name,blob,url:URL.createObjectURL(blob)});
    }
    renderPhotos();
  };
  renderPhotos();

  /* save */
  $("eSave").onclick=async()=>{
    if(!$("eSite").value){ $("eMsg").innerHTML=`<div class="msg err">No active projects — add one first.</div>`; return; }
    const f=collectForm();
    if(!f.manpower.length){ $("eMsg").innerHTML=`<div class="msg err">${MPMODE==="worker"?"Select at least one worker.":"Add at least one manpower row (choose a trade and number of men)."}</div>`; return; }
    const payload={
      report_date:f.report_date, site_id:f.site_id, work_item_id:f.work_item_id,
      supervisor_id: editing?editing.supervisor_id:ME.id, is_holiday:f.is_holiday,
      manpower:f.manpower, materials:f.materials, equipment:f.equipment, progress_note:f.progress_note
    };
    if(editing && editing.status==="rejected") payload.status="submitted";
    $("eSave").disabled=true; $("eMsg").innerHTML=`<div class="msg ok">Saving…</div>`;

    if(!navigator.onLine && !editing){
      const skipped=await queueReport(payload,PHOTOS);
      $("eSave").disabled=false; clearDraft();
      $("eMsg").innerHTML=`<div class="msg ok">No signal — report saved on this device and will be sent automatically when you are back online.${skipped?` ${skipped} photo(s) could not be held offline.`:""}</div>`;
      PHOTOS=[]; setTimeout(()=>openTab("entry"),1800); return;
    }
    let res;
    try{ res=await pushReport(payload,PHOTOS,KEEP,editing?editing.id:null); }
    catch(e){ res={error:{message:String(e.message||e)}}; }
    $("eSave").disabled=false;
    if(res.error){
      if(!editing && /fetch|network|Failed/i.test(res.error.message)){
        const skipped=await queueReport(payload,PHOTOS); clearDraft(); PHOTOS=[];
        $("eMsg").innerHTML=`<div class="msg ok">Connection lost — report saved on this device and queued.${skipped?` ${skipped} photo(s) skipped.`:""}</div>`;
        setTimeout(()=>openTab("entry"),1800); return;
      }
      $("eMsg").innerHTML=`<div class="msg err">${esc(res.error.message)}</div>`; return;
    }
    clearDraft();
    if(editing){ $("eMsg").innerHTML=`<div class="msg ok">Report updated.</div>`; setTimeout(()=>openTab(ME.role==="admin"?"reports":"mine"),900); return; }
    $("eMsg").innerHTML=`<div class="msg ok">Report submitted for ${fmtD(payload.report_date)} — ${esc(siteName(payload.site_id))}. Pending office review.</div>`;
    PHOTOS=[]; KEEP=[];
    $("eNote").value="";
    const fs=$("main").querySelector('fieldset[data-kind="mp"]');
    fs.querySelector(".rowset").innerHTML = MPMODE==="worker"?wkRow():mpRow();
    ["mat","eq"].forEach(k=>{ const f2=$("main").querySelector(`fieldset[data-kind="${k}"]`); f2.querySelector(".rowset").innerHTML=""; wireRowset(f2); });
    wireRowset(fs); wireAllBtn(); renderPhotos();
  };
}

/* ================= WORKERS REGISTER + ATTENDANCE ================= */
async function vWorkers(){
  const admin = ME.role==="admin";
  const [dF,dT]=rangeDefaults();
  $("main").innerHTML=`
    <div class="grid" style="grid-template-columns:1fr;gap:18px">
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:10px">Worker register</h2>
        <div class="f3" style="margin-bottom:10px">
          <div><label>Full name</label><input id="wName" placeholder="e.g. Rajesh Kumar"></div>
          <div><label>Work permit / FIN / emp no.</label><input id="wEmp" placeholder="optional"></div>
          <div><label>Trade</label><select id="wTrade">${TRADES.filter(t=>t.active).map(t=>`<option>${esc(t.name)}</option>`).join("")}</select></div>
        </div>
        <div class="f3" style="margin-bottom:10px">
          <div><label>Posted to project</label><select id="wSite"><option value="">— none —</option>${SITES.filter(s=>s.active).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
          ${admin?`<div><label>Own rate (${esc(SET.currency)}/hr, blank = trade rate)</label><input type="number" step="any" min="0" id="wRate" placeholder="0"></div>`:""}
          <div style="display:flex;align-items:end"><button class="btn" id="wAdd" style="width:100%">Add worker</button></div>
        </div>
        <div id="wMsg"></div>
        <div class="tblwrap" style="margin-top:10px"><table class="tbl" id="wTbl"></table></div>
      </div>
      <div class="card">
        <h2 style="font-size:18px;margin-bottom:10px">Attendance summary</h2>
        <div class="flexbar">
          <div><label>From</label><input type="date" id="aFrom" value="${dF}"></div>
          <div><label>To</label><input type="date" id="aTo" value="${dT}"></div>
          <div style="min-width:200px"><label>Project</label><select id="aSite"><option value="">All</option>${SITES.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
          <button class="btn sm" id="aGo">Apply</button>
          <button class="btn sec sm" id="aCsv">Export CSV</button>
        </div>
        <div id="aBody"></div>
        <p class="hint">Only reports entered in “by worker name” mode appear here. Rejected reports are excluded.</p>
      </div>
    </div>`;

  function wTable(){
    $("wTbl").innerHTML=`
      <tr><th>Name</th><th>WP / emp no.</th><th>Trade</th><th>Project</th><th style="text-align:right">Rate</th><th>Status</th>${admin?"<th></th>":""}</tr>
      ${WORKERS.map(w=>`<tr>
        <td>${esc(w.name)}</td><td class="mono">${esc(w.emp_no||"—")}</td><td>${esc(w.trade||"—")}</td>
        <td>${esc(w.site_id?siteName(w.site_id):"—")}</td>
        <td class="num">${+w.rate>0?money(w.rate):`<span class="muted">trade</span>`}</td>
        <td><span class="pill ${w.active?"ongoing":"inactive"}">${w.active?"active":"inactive"}</span></td>
        ${admin?`<td style="text-align:right;white-space:nowrap">
          <button class="btn sec sm" data-wtog="${w.id}">${w.active?"Deactivate":"Activate"}</button>
          <button class="btn danger sm" data-wdel="${w.id}">×</button></td>`:""}
      </tr>`).join("")||`<tr><td colspan="7" class="muted">No workers yet.</td></tr>`}`;
    if(!admin) return;
    $("wTbl").querySelectorAll("[data-wtog]").forEach(b=>b.onclick=async()=>{
      const w=workerById(b.dataset.wtog);
      await sb.from("workers").update({active:!w.active}).eq("id",w.id); await loadBase(); wTable();
    });
    $("wTbl").querySelectorAll("[data-wdel]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Remove this worker from the register? Past reports keep his name."))return;
      const {error}=await sb.from("workers").delete().eq("id",b.dataset.wdel);
      if(error) $("wMsg").innerHTML=`<div class="msg err">${esc(error.message)}</div>`;
      await loadBase(); wTable();
    });
  }
  wTable();
  $("wAdd").onclick=async()=>{
    const name=$("wName").value.trim();
    if(!name) return $("wMsg").innerHTML=`<div class="msg err">Enter the worker's name.</div>`;
    const row={name, emp_no:$("wEmp").value.trim()||null, trade:$("wTrade").value, site_id:$("wSite").value||null};
    if(admin) row.rate=+($("wRate").value||0)||0;
    const {error}=await sb.from("workers").insert(row);
    $("wMsg").innerHTML=error?`<div class="msg err">${esc(error.message)}</div>`:`<div class="msg ok">${esc(name)} added.</div>`;
    if(!error){ $("wName").value=""; $("wEmp").value=""; if($("wRate")) $("wRate").value=""; await loadBase(); wTable(); }
  };

  let ATT=[];
  async function att(){
    const reps=await fetchReports($("aFrom").value,$("aTo").value,$("aSite").value||null,{costable:true});
    const by={};
    reps.forEach(r=>{
      const dayM=r.is_holiday?+SET.holiday_multiplier:1, otEff=r.is_holiday?+SET.holiday_multiplier:+SET.ot_multiplier;
      (r.manpower||[]).forEach(m=>{
        if(!m.worker_id) return;
        const w=workerById(m.worker_id);
        const k=m.worker_id;
        const o=(by[k]=by[k]||{name:m.worker_name||(w?w.name:"(removed)"),emp:(w&&w.emp_no)||"",trade:m.trade||(w?w.trade:""),days:0,norm:0,ot:0,cost:0,sites:new Set()});
        const nh=+(m.norm_hours??m.hours)||0, oh=+m.ot_hours||0, rate=mpRate(m);
        o.days++; o.norm+=nh; o.ot+=oh; o.cost+=rate*(nh*dayM+oh*otEff); o.sites.add(siteName(r.site_id));
      });
    });
    ATT=Object.values(by).sort((a,b)=>b.norm+b.ot-(a.norm+a.ot));
    const tot=ATT.reduce((a,o)=>({d:a.d+o.days,n:a.n+o.norm,o:a.o+o.ot,c:a.c+o.cost}),{d:0,n:0,o:0,c:0});
    $("aBody").innerHTML=ATT.length?`
      <div class="board">${[[ATT.length,"Workers on site"],[n1(tot.d),"Man-days"],[n1(tot.n+tot.o),"Man-hours"],[n1(tot.o),"OT hours"]]
        .concat(ME.role==="admin"?[[money(tot.c),"Labour cost"]]:[])
        .map(([v,l])=>`<div class="stat"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("")}</div>
      <div class="tblwrap"><table class="tbl">
        <tr><th>Worker</th><th>WP / emp no.</th><th>Trade</th><th>Projects</th><th style="text-align:right">Days</th><th style="text-align:right">Norm hrs</th><th style="text-align:right">OT hrs</th>${ME.role==="admin"?`<th style="text-align:right">Cost</th>`:""}</tr>
        ${ATT.map(o=>`<tr><td>${esc(o.name)}</td><td class="mono">${esc(o.emp||"—")}</td><td>${esc(o.trade||"—")}</td>
          <td style="font-size:12px">${esc([...o.sites].join(", "))}</td>
          <td class="num">${o.days}</td><td class="num">${n1(o.norm)}</td><td class="num">${n1(o.ot)}</td>
          ${ME.role==="admin"?`<td class="num">${money(o.cost)}</td>`:""}</tr>`).join("")}
      </table></div>`
      :`<p class="muted">No named-worker attendance in this range.</p>`;
  }
  $("aGo").onclick=att; await att();
  $("aCsv").onclick=()=>{
    const rows=[["Worker","WP/Emp no","Trade","Projects","Days","Norm hrs","OT hrs","Labour cost"]]
      .concat(ATT.map(o=>[o.name,o.emp,o.trade,[...o.sites].join(" / "),o.days,o.norm,o.ot,o.cost.toFixed(2)]));
    const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
    a.download=`attendance_${$("aFrom").value}_to_${$("aTo").value}.csv`; a.click();
  };
}

/* ================= SUPERVISOR: MY REPORTS ================= */
async function vMine(){
  const {data}=await sb.from("daily_reports").select("*").eq("supervisor_id",ME.id).order("report_date",{ascending:false}).limit(60);
  const reps=data||[];
  const rej=reps.filter(r=>r.status==="rejected");
  $("main").innerHTML=`<h2 style="font-size:20px;margin-bottom:12px">My recent reports</h2>
    ${rej.length?`<div class="msg err">${rej.length} report(s) were sent back by the office. Open them below, fix the entry and save — they go back for review automatically.</div>`:""}
    <div id="mList">${reps.map(r=>repCard(r,false)).join("")||`<p class="muted">No reports yet — submit your first daily report.</p>`}</div>`;
  wireRepActions($("mList"),()=>openTab("mine"),reps);
}

window.addEventListener("online", ()=>{ netStatus(); flushQueue(); });
window.addEventListener("offline", netStatus);
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
init();
</script>
</body>
</html>
